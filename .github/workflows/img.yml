name: Image tooling

# Runs the commands of docs/development/img.md for both architectures on a pull
# request that changes img/, so a broken build shows before a release tag. The
# release jobs that publish rite-img and the base ISOs (release.yml) run only on
# a tag. Any base branch, so a pull request stacked on another one runs it too.
on:
  pull_request:
    paths:
      - 'img/**'
      - '.github/workflows/img.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint the scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck img/*.sh img/lib/*.sh img/auto/* img/config/rite-session img/config/rite-kiosk img/config/mount-outputs img/config/setup-hook.sh

  # The musl toolchain images are linux/amd64, so both binaries cross-compile
  # here, as in the release.
  binaries:
    name: Bake the rite binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bake binaries
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: ./docker-bake.hcl
          targets: binaries
          # Reads the CI smoke build's cache without writing to it.
          set: |
            *.cache-from=type=gha,scope=ci-smoke

      - name: Upload rite-linux-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-linux-amd64
          path: dist/amd64/rite
          if-no-files-found: error
          retention-days: 1

      - name: Upload rite-linux-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-linux-arm64
          path: dist/arm64/rite
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build an image (${{ matrix.arch }})
    needs: [binaries]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the rite binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rite-linux-${{ matrix.arch }}
          path: out/bin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the rite-img image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: img
          tags: rite-img
          load: true
          cache-from: type=gha,scope=img-tooling-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=img-tooling-${{ matrix.arch }}

      - name: Build the base ISO
        run: |
          docker run --rm --privileged -v "$PWD:/work" rite-img build-iso \
            --binary out/bin/rite --output out/rite.iso

      - name: Add a ceremony
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --iso out/rite.iso \
            --ceremony examples/showcase/demo.rite.yaml \
            --output out/demo.img

      # docs/development/img.md says build-img is reproducible.
      - name: Check that build-img is reproducible
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --iso out/rite.iso \
            --ceremony examples/showcase/demo.rite.yaml \
            --output out/demo-again.img
          cmp out/demo.img out/demo-again.img

      - name: Read back the outputs partition
        run: |
          docker run --rm -v "$PWD:/work" rite-img extract \
            --image out/demo.img --output out/outputs
