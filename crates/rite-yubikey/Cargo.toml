[package]
name        = "rite-yubikey"
description = "YubiKey backend for Rite ceremonies, PIV with Yubico extensions (internal to the `rite` CLI; no stable API)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords   = []
categories = []
publish    = true

[dependencies]
rite-sdk = { workspace = true }
rite-piv = { workspace = true }

# The `untested` feature gates the on-device attestation call (slot F9), which
# is the YubiKey demo path. Yubico flags it untested in their CI, not unsafe.
yubikey    = { workspace = true, features = ["untested"] }
serde_json = { workspace = true }

[lints]
workspace = true
