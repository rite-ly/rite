name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            rite_target: linux-amd64
            use_cross: true
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            rite_target: linux-amd64-musl
            use_cross: true
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            rite_target: linux-arm64
            use_cross: true
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            rite_target: linux-arm64-musl
            use_cross: true
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            rite_target: darwin-amd64
            use_cross: false
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
            use_cross: false
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64
            use_cross: false

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: release-${{ matrix.rust_target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build rite
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-cli --target ${{ matrix.rust_target }} --features openssl-vendored

      - name: Build rite-ls
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          for target in linux-amd64 linux-amd64-musl linux-arm64 linux-arm64-musl darwin-amd64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"
          done
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"

          cp "$ARTS/rite-ls-linux-amd64/rite-ls"       "$RELEASE_DIR/rite-ls-${VERSION}-linux-amd64"
          cp "$ARTS/rite-ls-linux-amd64-musl/rite-ls"  "$RELEASE_DIR/rite-ls-${VERSION}-linux-amd64-musl"
          cp "$ARTS/rite-ls-linux-arm64/rite-ls"       "$RELEASE_DIR/rite-ls-${VERSION}-linux-arm64"
          cp "$ARTS/rite-ls-linux-arm64-musl/rite-ls"  "$RELEASE_DIR/rite-ls-${VERSION}-linux-arm64-musl"
          cp "$ARTS/rite-ls-darwin-amd64/rite-ls"      "$RELEASE_DIR/rite-ls-${VERSION}-darwin-amd64"
          cp "$ARTS/rite-ls-darwin-arm64/rite-ls"      "$RELEASE_DIR/rite-ls-${VERSION}-darwin-arm64"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          sha256sum "$RELEASE_DIR"/* > "$RELEASE_DIR/SHA256SUMS"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*
