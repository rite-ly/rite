version: "0.3"
name: "Signing Key Ceremony with Retry Guards"
description: |
  Generate a signing key and issue its certificate. The steps show bounded,
  default, and disabled retry policies.

backends:
  openssl:
    provider: openssl

roles:
  crypto_officer:
    person: "Alice Rivera"

sections:
  keygen:
    name: "Key Generation and Certification"
    role: ${role.crypto_officer}
    steps:
      generate_signing_key:
        action: generate_key
        backend: openssl
        # A hardware backend can fail transiently (device busy, token not
        # seated). The operator fixes the condition and retries, up to three
        # attempts in all; exhausting the cap fails the ceremony.
        retry:
          attempts: 3
        with:
          algorithm: ECDSA-P256
        creates: signing_keypair
        description: "Generate the ECDSA-P256 signing keypair."
      generate_signing_csr:
        action: generate_csr
        backend: openssl
        reads:
          signing_key: ${artifact.signing_keypair}
        with:
          subject: "CN=Example Signing Key,O=Example Org"
        creates: signing_csr
        # No retry field: a transient failure prompts retry or abort, with no
        # limit.
        description: "Create a certificate signing request for the key."
      issue_signing_cert:
        action: issue_certificate
        backend: openssl
        # Each use of the signing key is security-relevant, so a failure stops
        # the ceremony for human judgment rather than using the key again.
        retry: never
        reads:
          signing_key: ${artifact.signing_keypair}
          csr: ${artifact.signing_csr}
        with:
          profile: root_ca
          validity_days: 1825
        creates: signing_cert
        description: "Issue a five-year self-signed certificate."
