name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libpcsclite-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # ImageOS puts the runner's OS release in the cache key. Build scripts
      # detect system libraries such as OpenSSL, and a cache from another
      # release carries that release's detection.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          env-vars: ImageOS
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The default workspace build leaves the hardware-backend features off, so
      # lint the piv/yubikey code paths and their tests explicitly.
      - name: Clippy (hardware backends)
        run: cargo clippy -p rite-stdlib --features piv,yubikey --all-targets -- -D warnings
      - name: Clippy (pkcs11)
        run: cargo clippy -p rite-pkcs11 --all-targets -- -D warnings
      - name: Shellcheck (image tooling)
        run: shellcheck img/*.sh img/lib/*.sh img/mkosi/mkosi.postinst.chroot img/mkosi/mkosi.finalize img/mkosi/mkosi.extra/usr/lib/rite/*

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libpcsclite-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          env-vars: ImageOS
      - name: Test
        run: cargo test --workspace
      # piv/yubikey are off by default; run their action and backend tests,
      # plus the example smoke tests so the PIV example ceremony is exercised.
      - name: Test (hardware backends)
        run: cargo test -p rite-stdlib -p rite --features piv,yubikey

  pkcs11:
    name: PKCS#11 (SoftHSM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SoftHSM
        run: sudo apt-get update && sudo apt-get install -y libssl-dev softhsm2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          env-vars: ImageOS
      # The token questions are #[ignore]d so a normal test run skips them.
      # They answer what a real PKCS#11 token does, which is what keeps the
      # wrapping model's claims about tokens from being specification reading.
      - name: Initialise a token
        run: |
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = INFO\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf" \
            softhsm2-util --init-token --slot 0 --label rite-test --so-pin 1234 --pin 1234
      - name: Ask the token
        env:
          SOFTHSM2_CONF: ${{ runner.temp }}/softhsm/softhsm2.conf
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test -p rite-pkcs11 -- --ignored --nocapture --test-threads=1

  msrv:
    # Verifies the MSRV floor declared on the library crates that are
    # published to crates.io. Binary-supporting crates (rite-stdlib,
    # rite-openssl, rite-runtime, rite-render, rite, rite-ls) ship as
    # part of the bundled product and float with the latest stable Rust.
    # Bump both this toolchain and the crates' `rust-version` together.
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check
        run: cargo check -p rite-sdk -p rite-model -p rite-resolver

  build:
    name: Build (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          env-vars: ImageOS
      - name: Build
        run: |
          cargo build -p rite --features openssl-vendored
          cargo build -p rite-ls
      # The default runner links OpenSSL 3.0, which has no ML-DSA or ML-KEM, so
      # the Test job compiles every `ossl350` test out of `rite-openssl` and
      # skips the post-quantum example. This job bundles OpenSSL 3.6, so both
      # run here, and anything behind that cfg is covered by this step alone.
      # RITE_OSSL360=0 then compiles the 3.5 side, which has ML-DSA and
      # refuses to generate an ML-KEM key or wrap to one.
      - name: Test (vendored OpenSSL)
        run: |
          cargo test -p rite-openssl --features vendored
          cargo test -p rite --features openssl-vendored --test examples
          RITE_OSSL360=0 cargo clippy -p rite-openssl --features vendored --all-targets -- -D warnings
          RITE_OSSL360=0 cargo test -p rite-openssl --features vendored

  docker:
    name: Docker (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Exercise the Dockerfile build path so PRs catch regressions in the
      # toolchain image, bake spec, or runtime stage layout.
      - name: Bake binaries
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: ./docker-bake.hcl
          targets: binaries
          set: |
            *.cache-from=type=gha,scope=ci-smoke
            *.cache-to=type=gha,mode=max,scope=ci-smoke
      - name: Verify static musl binaries
        # amd64 produces "static-pie linked"; arm64 produces "statically linked"
        # (no PIE). Both are static (zero runtime deps); the PIE asymmetry comes
        # from Rust's target specs: x86_64-unknown-linux-musl sets
        # `static_position_independent_executables = true`, aarch64 does not.
        #
        # TODO: revisit when Rust adds static-PIE to aarch64-unknown-linux-musl
        # upstream (or set CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=
        # "-C link-arg=-static-pie" to force it here). Then tighten the grep
        # below back to 'static-pie linked' so a regression on either arch fails.
        run: |
          for f in dist/amd64/rite dist/amd64/rite-ls dist/arm64/rite dist/arm64/rite-ls; do
            file "$f" | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'
          done

  # Runs the commands of docs/development/img.md for both architectures, so a
  # broken Rite Live build shows before a release tag. The release jobs that
  # publish rite-img and the Live systems (release.yml) run only on a tag. The
  # caches are written on main and only read by pull requests.
  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The glibc binary shipped in the Live systems and linux-<arch>-glibc
      # tarballs. The build runs it on the oldest distribution it supports. The
      # system must provide the libraries it links, which a static binary would
      # not check.
      - name: Build the glibc rite binary
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: ./docker-bake.hcl
          targets: binary-glibc-${{ matrix.arch }}
          set: |
            *.cache-from=type=gha,scope=ci-glibc-${{ matrix.arch }}
            ${{ github.event_name == 'push' && format('*.cache-to=type=gha,mode=max,scope=ci-glibc-{0}', matrix.arch) || '' }}

      - name: Build the rite-img image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: img
          tags: rite-img
          load: true
          cache-from: type=gha,scope=ci-img-tooling-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=ci-img-tooling-{0}', matrix.arch) || '' }}

      - name: Build the Live system
        run: |
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" rite-img build-system \
            --binary dist/glibc-${{ matrix.arch }}/rite \
            --output out/live.img \
            --roothash out/live.roothash
          grep -qxE '[0-9a-f]{64}' out/live.roothash

      - name: Add a ceremony
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --system out/live.img \
            --definition examples/showcase/demo.rite.yaml \
            --output out/demo.img

      # docs/development/img.md says build-img is reproducible.
      - name: Check that build-img is reproducible
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --system out/live.img \
            --definition examples/showcase/demo.rite.yaml \
            --output out/demo-again.img
          cmp out/demo.img out/demo-again.img

      - name: Read back the outputs partition
        run: |
          docker run --rm -v "$PWD:/work" rite-img extract \
            --image out/demo.img \
            --output out/outputs
