version: "0.3"
name: "Wrapping a Key for Transport"
description: |
  Wrap a key twice, under two different custody arrangements, and unwrap one of
  them back.

  Demonstrates wrap_key and unwrap_key. The input a wrap step reads is what
  decides who can undo it: wrapping_key: names a key this backend holds, so the
  ceremony keeps the means to unwrap, while recipient: names a public key held
  by someone else, so only they can open the result.

backends:
  openssl:
    provider: openssl

parameters:
  escrow_fingerprint:
    type: string
    default: "sha256:0de3cef37d95cd5137ef49d1812e0d012699fd34ea71f3be80161201f68c888a"
    description: |
      SHA-256 of the escrow public key's SPKI DER, which a real ceremony would
      obtain from the escrow holder out of band rather than read off the key
      file it was handed.

materials:
  escrow_pubkey:
    type: digital
    path: "test_keys/escrow_public.pem"
    title: "Escrow transport public key"
    description: "Public key of a party outside this ceremony."

output:
  wrapped_demo_key:
    type: wrapped_key
    description: "The demo key wrapped under the ceremony's own transport key."
  escrowed_demo_key:
    type: wrapped_key
    description: "The demo key wrapped to the escrow holder's public key."
  kek_wrapped_demo_key:
    type: wrapped_key
    description: "The demo key wrapped under a symmetric key-encryption key."
  wrapped_kek:
    type: wrapped_key
    description: "The symmetric key-encryption key itself, ready to carry to a second backend."

roles:
  operator:
    name: "Operator"
    person: "Alice Rivera"

sections:
  prepare:
    name: "Generate the Keys"
    role: ${role.operator}
    steps:
      generate_demo_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
          policy:
            extractable: true
        creates: demo_keypair
        description: |
          The key that will be wrapped. Any key type will do.

          policy: is what the key is allowed to be, in PKCS#11 terms. The
          default is the restrictive one, a key that signs and never leaves,
          so a key meant to be wrapped has to say extractable: true. Without
          it the wrap step refuses, which is the point: a key does not quietly
          become exportable because a later step wants it to be.

      generate_transport_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: RSA-2048
          policy:
            usages: [wrap, unwrap]
        creates: transport_keypair
        description: |
          A second key, held by this backend, that will wrap the first. An EC
          or ML-KEM key would work equally well: the recipient's key type
          selects the encapsulation, and the transcript records which one was
          used.

          Its usages say wrap and unwrap rather than the default sign and
          verify, so this key can do the job below and cannot sign anything.

      generate_kek:
        action: generate_key
        backend: openssl
        with:
          algorithm: AES-256
          policy:
            extractable: true
        creates: kek
        description: |
          A symmetric key-encryption key. It has no public half, so it can
          never appear as recipient:, and its usages need no declaring: a
          symmetric key defaults to wrap and unwrap, which is the only thing
          Rite holds one for.

          extractable: true is the one thing this ceremony does have to say.
          A KEK that stays on this machine forever would not need it; this one
          is wrapped and carried to a second backend in the act below, which is
          what a cross-HSM import looks like, and a key that cannot leave
          cannot be carried.

          The transcript records it by a key check value, cmac-aes: followed
          by six hex digits, rather than by a fingerprint. That is the value
          an HSM prints on its own display, so a custodian can compare the two
          without either side handling the key.

      read_back_the_kcv:
        action: oral_readback
        with:
          message: |
            Read the key check value aloud. A second custodian confirms it
            against what the device displays.
          value: "${artifact.kek.kcv | hex}"
        description: |
          The check value is the whole point of having one: two people compare
          a short string, and neither has to touch the key to do it.

          On a real token the same step is what catches a key generated in the
          wrong slot, on the wrong device, or from a previous ceremony.

  wrap:
    name: "Wrap Under Two Custodies"
    role: ${role.operator}
    steps:
      wrap_under_ceremony_key:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          wrapping_key: ${artifact.transport_keypair}
        creates: wrapped_demo_key
        description: |
          Wrap under a key this backend holds. Both keys must live on the same
          backend, and the ceremony can unwrap the result itself, which the
          next act does.

      wrap_to_escrow:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          recipient: ${artifact.escrow_pubkey}
        with:
          expect_recipient: ${param.escrow_fingerprint}
        creates: escrowed_demo_key
        description: |
          Wrap the same key to a public key held elsewhere. Nobody here can
          open this one.

          expect_recipient makes the step refuse a key that does not match the
          fingerprint the ceremony declares. Without it the run would wrap to
          whatever key it was handed and record that faithfully, which is not
          the same as being right.

      wrap_under_kek:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          wrapping_key: ${artifact.kek}
        creates: kek_wrapped_demo_key
        description: |
          Wrap under the symmetric key. No scheme: here, because the default
          CMS container works for a symmetric key too: the recipient becomes a
          KEKRecipientInfo naming the key both sides hold, and everything else
          about the blob is what the other two wraps produce.

          That is worth having. The blob carries its own algorithm
          identifiers, so rite verify re-derives them and reports this wrap as
          checked rather than merely recorded, and openssl cms -decrypt
          -secretkey opens it years from now with no Rite binary present.

          The raw alternatives are scheme: AES-256-KWP and AES-256-KW, for a
          recipient that requires exactly those bytes, such as an HSM or KMS
          import path. They carry no algorithm identifiers, so they name the
          KEK size themselves and verify can only record what was invoked.

      wrap_the_kek_itself:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.kek}
          wrapping_key: ${artifact.transport_keypair}
        creates: wrapped_kek
        description: |
          The symmetric key as the payload rather than as the wrapping key.
          This is the blob that travels to a second HSM, and the act below
          recovers it.

  restore:
    name: "Unwrap It Back"
    role: ${role.operator}
    steps:
      unwrap_demo_key:
        action: unwrap_key
        backend: openssl
        reads:
          unwrapping_key: ${artifact.transport_keypair}
          wrapped_data: ${artifact.wrapped_demo_key}
        with:
          label: "restored-demo-key"
          expect_key: "sha256:${artifact.demo_keypair.public | sha256 | hex}"
        creates: restored_keypair
        description: |
          Unwrap and import under a new label. The scheme is not restated: it
          comes from the wrapped artifact, so it cannot disagree with the bytes
          being decrypted.

          No algorithm: here either, because a keypair names itself once its
          DER parses. Declaring one would still be checked against what came
          out, and the step below has to declare one.

          expect_key names the key that must come out. Here it is written as an
          expression over the key that went in, so the step asserts the round
          trip. In a restore ceremony, where the original key is not present,
          the same field carries the fingerprint the origin ceremony recorded.

      restore_the_kek:
        action: unwrap_key
        backend: openssl
        reads:
          unwrapping_key: ${artifact.transport_keypair}
          wrapped_data: ${artifact.wrapped_kek}
        with:
          algorithm: AES-256
          label: "restored-kek"
          expect_key: "cmac-aes:${artifact.kek.kcv | hex}"
        creates: restored_kek
        description: |
          Recovering the symmetric key needs algorithm:. Nothing travels with a
          wrapped key saying what it is, and a 32-byte secret is not
          distinguishable from any other 32 bytes, so the receiving ceremony
          declares it the way it declares policy:. Get it wrong and the step
          fails on the size rather than importing something else.

          expect_key is a check value here, not a fingerprint, because that is
          how a key with no public half is named. The restored key defaults to
          wrap and unwrap, following the declared algorithm.
