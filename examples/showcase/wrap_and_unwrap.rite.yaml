version: "0.3"
name: "Wrapping a Key for Transport"
description: |
  Wrap a key under backend-held and external keys, then recover it. Also wraps
  and recovers a symmetric key-encryption key (KEK).

  The input a wrap step reads decides who can undo it: wrapping_key names a
  key this backend holds, so the ceremony can unwrap the result; recipient
  names a public key held by someone else, so only they can open it.

backends:
  openssl:
    provider: openssl

parameters:
  escrow_fingerprint:
    type: string
    default: "sha256:0de3cef37d95cd5137ef49d1812e0d012699fd34ea71f3be80161201f68c888a"
    description: |
      SHA-256 of the escrow public key's SPKI DER, which a real ceremony would
      obtain from the escrow holder out of band rather than read off the key
      file it was handed.

materials:
  escrow_pubkey:
    type: digital
    path: "test_keys/escrow_public.pem"
    title: "Escrow transport public key"
    description: "Escrow holder's public transport key."

output:
  wrapped_demo_key:
    type: wrapped_key
    description: "The demo key wrapped under the ceremony's own transport key."
  escrowed_demo_key:
    type: wrapped_key
    description: "The demo key wrapped to the escrow holder's public key."
  kek_wrapped_demo_key:
    type: wrapped_key
    description: "The demo key wrapped under a symmetric key-encryption key."
  wrapped_kek:
    type: wrapped_key
    description: "The symmetric key-encryption key itself, ready to carry to a second backend."

roles:
  operator:
    name: "Operator"
    person: "Alice Rivera"

sections:
  prepare:
    name: "Generate the Keys"
    role: ${role.operator}
    steps:
      generate_demo_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
          policy:
            extractable: true
        # The default policy is a key that signs and never leaves, so a key
        # does not become exportable because a later step wants it to.
        creates: demo_keypair
        description: |
          Generate a key that can be wrapped. `extractable: true` is required
          because the private key will leave the backend under protection.

      generate_transport_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: RSA-2048
          policy:
            usages: [wrap, unwrap]
        # An EC or ML-KEM key works the same way: the recipient's key type
        # selects the encapsulation.
        creates: transport_keypair
        description: |
          Generate an RSA transport key with wrap and unwrap usages. The
          recipient key determines the encapsulation recorded in the transcript.

      generate_kek:
        action: generate_key
        backend: openssl
        with:
          algorithm: AES-256
          policy:
            extractable: true
        # The key check value is what an HSM shows on its own display, so a
        # custodian can compare the two without either side handling the key.
        creates: kek
        description: |
          Generate an AES-256 KEK. It has no public half and is identified by
          its CMAC-AES check value, not a fingerprint. It must be extractable
          so it can be wrapped for transfer to another backend.

      read_back_the_kcv:
        action: oral_readback
        with:
          message: |
            Read the key check value aloud. A second custodian confirms it
            against what the device displays.
          value: "${artifact.kek.kcv | hex}"
        description: |
          Compare the key check value displayed by the backend with the value
          read aloud by the second custodian.

  wrap:
    name: "Wrap Under Two Custodies"
    role: ${role.operator}
    steps:
      wrap_under_ceremony_key:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          wrapping_key: ${artifact.transport_keypair}
        creates: wrapped_demo_key
        description: |
          Wrap the key under the backend-held transport key.

      wrap_to_escrow:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          recipient: ${artifact.escrow_pubkey}
        # Pin the recipient to the fingerprint supplied out of band.
        with:
          expect_recipient: ${param.escrow_fingerprint}
        creates: escrowed_demo_key
        description: |
          Wrap the key to the escrow public key. Confirm the recipient
          fingerprint matches the value recorded for this ceremony.

      wrap_under_kek:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.demo_keypair}
          wrapping_key: ${artifact.kek}
        # No scheme: the default CMS container also works under a symmetric
        # key (a KEKRecipientInfo). It carries its algorithm identifiers, so
        # rite verify reports the wrap as checked, and openssl cms -decrypt
        # -secretkey opens it without Rite. scheme: AES-256-KWP or AES-256-KW
        # write the raw bytes an HSM or KMS import may require; they carry no
        # identifiers, so verify can only record what was invoked.
        creates: kek_wrapped_demo_key
        description: |
          Wrap the key under the AES-256 KEK using the CMS container.

      wrap_the_kek_itself:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.kek}
          wrapping_key: ${artifact.transport_keypair}
        creates: wrapped_kek
        description: |
          Wrap the KEK itself so it can be transferred to another backend.

  restore:
    name: "Unwrap It Back"
    role: ${role.operator}
    steps:
      unwrap_demo_key:
        action: unwrap_key
        backend: openssl
        reads:
          unwrapping_key: ${artifact.transport_keypair}
          wrapped_data: ${artifact.wrapped_demo_key}
        with:
          label: "restored-demo-key"
          expect_key: "sha256:${artifact.demo_keypair.public | sha256 | hex}"
        # No scheme: unwrap_key reads it from the wrapped artifact. expect_key
        # is an expression over the original key, asserting the round trip; a
        # restore ceremony puts the fingerprint the origin ceremony recorded
        # here instead.
        creates: restored_keypair
        description: |
          Recover the keypair under a new label. `expect_key` checks that the
          recovered public key matches the generated keypair.

      restore_the_kek:
        action: unwrap_key
        backend: openssl
        reads:
          unwrapping_key: ${artifact.transport_keypair}
          wrapped_data: ${artifact.wrapped_kek}
        # A wrapped symmetric key does not say what it is, so algorithm: is
        # required; a wrong one fails on the size. A key with no public half is
        # named by its check value, not a fingerprint.
        with:
          algorithm: AES-256
          label: "restored-kek"
          expect_key: "cmac-aes:${artifact.kek.kcv | hex}"
        creates: restored_kek
        description: |
          Recover the AES-256 KEK and compare its check value with the value
          recorded before wrapping.
