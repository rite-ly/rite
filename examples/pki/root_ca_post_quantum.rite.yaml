version: "0.3"
name: "Post-Quantum Root CA Key Generation"
# The reasons for ML-DSA-87 and ML-KEM-768 are in README.md.
description: |
  Generate an offline ML-DSA-87 root CA key and wrap its backup to an ML-KEM-768
  transport key. This example requires OpenSSL 3.5 or newer at build time.

backends:
  openssl:
    provider: openssl

parameters:
  ceremony_date:
    type: date
    default: "2026-07-28"
    description: "Date of the ceremony (YYYY-MM-DD)"

materials:
  transport_pubkey:
    type: digital
    path: "test_keys/kem_transport_public.pem"
    description: |
      ML-KEM-768 (FIPS 203) transport public key. A copy of the wrapped
      backup can be kept until something can open it, so the backup is
      wrapped to a post-quantum key.

output:
  root_ca_cert:
    type: certificate
    description: "Self-signed ML-DSA-87 root CA certificate"
  wrapped_root_ca_key:
    type: wrapped_key
    description: "Root CA private key wrapped with transport key"

roles:
  crypto_officer:
    name: "Crypto Officer"
    person: "Alice Smith"
  witness__1:
    person: "Bob Jones"
  witness__2:
    person: "Carol White"

acts:
  - id: opening
    name: "Opening"
    description: "Verify participants and environment before proceeding."
  - id: key_generation
    name: "Root CA Key Generation"
    description: "Generate and protect the post-quantum root CA keypair."
  - id: closing
    name: "Closing"

prerequisites:
  - "Air-gapped workstation is powered on with all network interfaces disabled"
  - "The rite build in use links OpenSSL 3.5 or newer"

sections:
  environment:
    act: opening
    name: "Environment Verification"
    role: ${role.crypto_officer}
    steps:
      verify_time:
        action: clock_check
        with:
          message: "Verify the system clock before recording timestamps."
      record_machine:
        action: machine_info
        with:
          include_machine_id: true
          include_cpu: true
          include_os: true
      verify_air_gap:
        action: confirm
        with:
          message: "Confirm all network interfaces are disconnected and disabled."

  keygen:
    act: key_generation
    name: "Key Generation"
    role: ${role.crypto_officer}
    steps:
      generate_root_ca:
        action: generate_key
        backend: openssl
        with:
          algorithm: ML-DSA-87
          policy:
            # Wrapped for backup below, which a key may not be unless it says so.
            extractable: true
        creates: root_ca_keypair
        description: "Generate the ML-DSA-87 root CA keypair."
      generate_root_csr:
        action: generate_csr
        backend: openssl
        reads:
          signing_key: ${artifact.root_ca_keypair}
        with:
          subject: "CN=Post-Quantum Root CA,O=Example Org"
        creates: root_ca_csr
        description: "Create a certificate signing request for the root CA key."
      issue_root_cert:
        action: issue_certificate
        backend: openssl
        reads:
          signing_key: ${artifact.root_ca_keypair}
          csr: ${artifact.root_ca_csr}
        with:
          profile: root_ca
          validity_days: 7300
        creates: root_ca_cert
        description: "Issue the self-signed ML-DSA-87 root CA certificate."

  protection:
    act: key_generation
    name: "Key Protection"
    role: ${role.crypto_officer}
    steps:
      wrap_root_ca_key:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.root_ca_keypair}
          recipient: ${artifact.transport_pubkey}
        creates: wrapped_root_ca_key
        description: "Wrap the root CA private key to the transport public key."

  attestation:
    act: closing
    name: "Witness Attestation"
    steps:
      witness1_attest:
        action: attest
        role: ${role.witness__1}
        with:
          statement: "I witnessed the post-quantum root CA key generation and key wrapping."
      witness2_attest:
        action: attest
        role: ${role.witness__2}
        with:
          statement: "I witnessed the post-quantum root CA key generation and key wrapping."
      officer_attest:
        action: attest
        role: ${role.crypto_officer}
        with:
          statement: "ML-DSA-87 root CA keypair generated."

after:
  archive:
    type: archive_materials
    role: crypto_officer
    items:
      - "Ceremony transcript"
      - "Root CA certificate (root_ca_cert.pem)"
      - "Wrapped root CA key backup (wrapped_root_ca_key.bin)"
    location: "Secure document archive"
  notify:
    type: notify_stakeholders
    description: "Distribute root_ca_cert.pem to PKI team and update trust anchor documentation"
