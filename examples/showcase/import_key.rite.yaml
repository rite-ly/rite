version: "0.3"
name: "Importing Keys the Ceremony Holds"
description: |
  Import a symmetric key component and an encrypted private key into the
  OpenSSL backend. The first example records the component's check value; the
  second asks its custodian for the passphrase without exposing it on screen.

backends:
  openssl:
    provider: openssl

materials:
  kek_component:
    type: digital
    path: "test_keys/transport_kek_component.bin"
    title: "Transport KEK component"
    description: "32-byte AES key component on the custodian's media."
  escrow_key:
    type: digital
    path: "test_keys/escrow_private.pem"
    title: "Escrow private key"
    description: |
      Encrypted RSA-2048 PKCS#8 PEM used by this example.

roles:
  crypto_officer:
    name: "Crypto Officer"
    person: "Alice Rivera"
  escrow_holder:
    name: "Escrow Holder"
    person: "Ben Okafor"

output:
  wrapped_working_key:
    type: wrapped_key
    description: "A key generated here, wrapped under the imported transport KEK."

sections:
  install:
    name: "Install and Use the Transport Key"
    role: ${role.crypto_officer}
    steps:
      import_the_kek:
        action: import_key
        backend: openssl
        reads:
          key_material: ${artifact.kek_component}
        # algorithm: is required: 32 bytes of an AES key look like any other
        # 32 bytes. expect_key: comes from the paperwork that travelled with
        # the component, so a component swapped on the way in fails this
        # step. The policy restates the symmetric default to make the intent
        # visible.
        with:
          algorithm: AES-256
          label: transport-kek
          expect_key: "cmac-aes:d0cd55"
          policy:
            usages: [wrap, unwrap]
        creates: transport_kek
        description: |
          Import the component as an AES-256 key. Confirm its check value
          against the value supplied with the component.

      generate_working_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
          policy:
            extractable: true
        # Without extractable: true the wrap step below refuses the key.
        creates: working_key
        description: "Generate an ECDSA-P256 key to wrap under the imported KEK."

      wrap_under_the_imported_kek:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.working_key}
          wrapping_key: ${artifact.transport_kek}
        creates: wrapped_working_key
        # An imported key is used like a generated one: this is the same step
        # as for a KEK generated in the room.
        description: |
          Wrap the generated key under the imported KEK.

  recover:
    name: "Install the Escrow Key from Protected Media"
    role: ${role.escrow_holder}
    steps:
      record_the_media_serial:
        action: enter_value
        with:
          message: "Serial number printed on the escrow media"
          format: alphanumeric
          min_length: 6
          max_length: 16
        creates: escrow_media_serial
        description: |
          Record the media serial as a text artifact. The format and length
          bounds reject an entry that does not match the expected shape.

      unlock_the_escrow_key:
        # The fixture passphrase is "placeholder-secret", which is also what a
        # headless driver of a dry run types for a secret.
        action: enter_secret
        with:
          message: "Passphrase for the escrow key"
        creates: escrow_passphrase
        description: |
          The escrow holder enters the passphrase with input hidden. The
          transcript records that a secret was entered, not its value. No
          decrypted copy of the key is written to disk.

      install_the_escrow_key:
        action: import_key
        backend: openssl
        # The passphrase goes in reads:, never in with:. A with: value is
        # copied into the step's parameters, which a record may carry. Only a
        # secret artifact is accepted, so a passphrase read from a file is
        # refused.
        reads:
          key_material: ${artifact.escrow_key}
          passphrase: ${artifact.escrow_passphrase}
        with:
          algorithm: RSA-2048
          label: escrow-key
          expect_key: "sha256:52039f14c6659f4c7e6d49abd5cf6247fba4a0de4d5255a24d28ffc3fae586c0"
        creates: escrow_keypair
        description: |
          Import the encrypted PEM and compare the key's fingerprint with the
          value recorded for the escrow media. The wrong file fails this step
          rather than becoming the escrow key.
