[package]
name        = "rite-piv"
description = "PIV smart card backend for Rite ceremonies (internal to the `rite` CLI; no stable API)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords   = []
categories = []
publish    = true

[dependencies]
rite-sdk = { workspace = true }

yubikey    = { workspace = true }
# Tracks the `yubikey` crate's der version (0.7), not the workspace der (0.8):
# this crate only uses der to re-encode certificate/SPKI values returned by
# yubikey, so its der must match yubikey's or those types lose their der traits.
der        = "0.7"
sha2       = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
