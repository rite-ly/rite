name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test
        run: cargo test --workspace

  msrv:
    # Verifies the MSRV floor declared on the library crates that are
    # published to crates.io. Binary-supporting crates (rite-stdlib,
    # rite-openssl, rite-runtime, rite-render, rite, rite-ls) ship as
    # part of the bundled product and float with the latest stable Rust.
    # Bump both this toolchain and the crates' `rust-version` together.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check
        run: cargo check -p rite-sdk -p rite-model -p rite-resolver

  build:
    name: Build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build
        run: |
          cargo build -p rite --features openssl-vendored
          cargo build -p rite-ls

  docker:
    name: Docker (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # Exercise the Dockerfile build path so PRs catch regressions in the
      # toolchain image, bake spec, or runtime stage layout.
      - name: Bake binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: ./docker-bake.hcl
          targets: binaries
          set: |
            *.cache-from=type=gha,scope=ci-smoke
            *.cache-to=type=gha,mode=max,scope=ci-smoke
      - name: Verify static musl binaries
        # amd64 produces "static-pie linked"; arm64 produces "statically linked"
        # (no PIE). Both are static (zero runtime deps); the PIE asymmetry comes
        # from Rust's target specs: x86_64-unknown-linux-musl sets
        # `static_position_independent_executables = true`, aarch64 does not.
        #
        # TODO: revisit when Rust adds static-PIE to aarch64-unknown-linux-musl
        # upstream (or set CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=
        # "-C link-arg=-static-pie" to force it here). Then tighten the grep
        # below back to 'static-pie linked' so a regression on either arch fails.
        run: |
          for f in dist/amd64/rite dist/amd64/rite-ls dist/arm64/rite dist/arm64/rite-ls; do
            file "$f" | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'
          done
