name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_date: ${{ steps.commit.outputs.date }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve commit metadata
        id: commit
        # Stamped into every binary (native + docker) via RITE_BUILD_COMMIT /
        # RITE_BUILD_COMMIT_DATE so all artefacts for this release report the
        # same commit format. Short SHA via %h; date via %cd --date=short.
        run: git log -1 --format='sha=%h%ndate=%cd' --date=short >> "$GITHUB_OUTPUT"

  build-native:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            rite_target: darwin-amd64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.rust_target }}

      - name: Build rite
        run: cargo build --release -p rite-cli --target ${{ matrix.rust_target }} --features openssl-vendored

      - name: Build rite-ls
        run: cargo build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  build-linux-and-image:
    name: Build Linux binaries and push image
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        # Annotate the index (manifest list) as well as the per-platform manifests.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/rite-ly/rite
          # latest=auto applies the `latest` tag only when the ref is a stable semver.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Static OCI labels listed explicitly so all metadata lives in one place.
          # metadata-action also auto-fills `created`, `revision`, and `version` at build time.
          labels: |
            org.opencontainers.image.title=rite
            org.opencontainers.image.description=DSL and runtime for cryptographic key ceremonies
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only
          bake-target: image

      - name: Bake binaries + image
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        env:
          RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: default
          set: |
            image.output=type=registry,push=true
            *.cache-from=type=gha,scope=release-docker
            *.cache-to=type=gha,mode=max,scope=release-docker

      - name: Stage Linux binaries for upload
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          mv dist/amd64/rite    target/x86_64-unknown-linux-musl/release/rite
          mv dist/amd64/rite-ls target/x86_64-unknown-linux-musl/release/rite-ls
          mv dist/arm64/rite    target/aarch64-unknown-linux-musl/release/rite
          mv dist/arm64/rite-ls target/aarch64-unknown-linux-musl/release/rite-ls

      - name: Upload rite-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

      - name: Upload rite-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

  release:
    name: Create Release
    needs: [validate, build-native, build-linux-and-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          # Unix: rite as tarball, rite-ls as flat binary
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            chmod +x "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"

            cp "$ARTS/rite-ls-${target}/rite-ls" "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
            chmod +x "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
          done

          # Windows: rite as zip, rite-ls as flat binary
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          sha256sum "$RELEASE_DIR"/* > "$RELEASE_DIR/SHA256SUMS"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*
