[package]
name        = "rite-piv"
description = "PIV smart card backend for Rite ceremonies (internal to the `rite` CLI; no stable API)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords   = []
categories = []
publish    = true

[dependencies]
rite-sdk = { workspace = true }

yubikey    = { workspace = true }
der        = { workspace = true }
sha2       = { workspace = true }
# Checks that a peer's point lies on its curve before it reaches the card
# (`ops::agree`). Validation of untrusted input, not a primitive under a key;
# see `docs/development/cryptographic-dependencies.md`. No type from either
# crosses this crate's API, so their version need not track `yubikey`'s,
# though it does today and compiles nothing new.
p256       = { version = "0.14", default-features = false, features = ["arithmetic"] }
p384       = { version = "0.14", default-features = false, features = ["arithmetic"] }
serde_json = { workspace = true }
# Constant-time checks in the OAEP decoding the host runs after the card's raw
# RSA operation (`oaep::decode`).
subtle     = { workspace = true }
zeroize    = { workspace = true }

[dev-dependencies]
openssl = { workspace = true }

[lints]
workspace = true
