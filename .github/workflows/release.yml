name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_date: ${{ steps.commit.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve commit metadata
        id: commit
        # Stamped into every binary (native + docker) via RITE_BUILD_COMMIT /
        # RITE_BUILD_COMMIT_DATE so all artefacts for this release report the
        # same commit format. Short SHA via %h; date via %cd --date=short.
        run: git log -1 --format='sha=%h%ndate=%cd' --date=short >> "$GITHUB_OUTPUT"

  build-native:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            rite_target: darwin-amd64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.rust_target }}

      - name: Build rite
        # PC/SC is a system framework on macOS (PCSC.framework) and Windows
        # (WinSCard), so the native release binaries carry the piv/yubikey
        # backends. Only the static musl Linux tarballs stay software-only.
        run: cargo build --release -p rite --target ${{ matrix.rust_target }} --features openssl-vendored,piv,yubikey

      - name: Build rite-ls
        run: cargo build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  # Static, software-only Linux tarballs. The rust-musl-cross toolchain images
  # are linux/amd64 (pinned via --platform in the Dockerfile), so both the amd64
  # and arm64 musl targets cross-compile on an amd64 host with no QEMU. The
  # hardware backends ship in the native binaries and the glibc image, not here.
  build-linux-musl:
    name: Build Linux musl binaries
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Bake musl binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
        with:
          files: ./docker-bake.hcl
          targets: binaries
          set: |
            *.cache-from=type=gha,scope=release-musl
            *.cache-to=type=gha,mode=max,scope=release-musl

      - name: Stage Linux binaries for upload
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          mv dist/amd64/rite    target/x86_64-unknown-linux-musl/release/rite
          mv dist/amd64/rite-ls target/x86_64-unknown-linux-musl/release/rite-ls
          mv dist/arm64/rite    target/aarch64-unknown-linux-musl/release/rite
          mv dist/arm64/rite-ls target/aarch64-unknown-linux-musl/release/rite-ls

      - name: Upload rite-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

      - name: Upload rite-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

  # Glibc runtime image, built one arch per runner so each compiles natively:
  # amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm (no QEMU). Each build is
  # pushed to ghcr.io by digest only; the merge job below assembles the tagged
  # multi-arch manifest list. The glibc build dynamically links libpcsclite and
  # system OpenSSL, so the image carries the piv/yubikey backends.
  build-image:
    name: Build image (${{ matrix.arch }})
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels + annotations for this single-platform manifest. The index
      # tags and index-level annotations are applied in the merge job.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rite-ly/rite
          labels: |
            org.opencontainers.image.title=rite
            org.opencontainers.image.description=DSL and runtime for cryptographic key ceremonies
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: release
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            CARGO_BUILD_ARGS=--features piv,yubikey
            RITE_BUILD_COMMIT=${{ needs.validate.outputs.commit_sha }}
            RITE_BUILD_COMMIT_DATE=${{ needs.validate.outputs.commit_date }}
          # Provenance is attested via Sigstore (actions/attest, in the merge
          # job); disable BuildKit's in-registry provenance so the index carries
          # a single signed attestation.
          provenance: false
          outputs: type=image,name=ghcr.io/rite-ly/rite,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}

      # Export the per-arch digest as a filename-only marker; the merge job
      # collects both and feeds them to `imagetools create`.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into the tagged multi-arch manifest list and
  # attest the resulting index.
  merge-image:
    name: Merge and push image manifest
    needs: [validate, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags + index-level annotations for the manifest list. latest=auto applies
      # the `latest` tag only on a stable semver ref; annotations are derived from
      # the same OCI labels and attached to the index by imagetools.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/rite-ly/rite
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=rite
            org.opencontainers.image.description=DSL and runtime for cryptographic key ceremonies
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only

      # Bash arrays (not word-split command substitution) so tag and annotation
      # values containing spaces survive intact.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done \
            < <(jq -r '.annotations[]' <<<"$METADATA")
          for digest in *; do
            args+=("ghcr.io/rite-ly/rite@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      # Resolve the pushed index digest to bind the attestation to it.
      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/rite-ly/rite:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sigstore-signed provenance for the pushed image, bound to the multi-arch
      # index digest and stored as an OCI referrer alongside it (verifiable with
      # `gh attestation verify oci://...`). Same mechanism as the binaries.
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/rite-ly/rite
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  release:
    name: Create Release
    needs: [validate, build-native, build-linux-musl, merge-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          # Unix: rite as tarball, rite-ls as flat binary
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            chmod +x "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"

            cp "$ARTS/rite-ls-${target}/rite-ls" "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
            chmod +x "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
          done

          # Windows: rite as zip, rite-ls as flat binary
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          sha256sum "$RELEASE_DIR"/* > "$RELEASE_DIR/SHA256SUMS"

      # Provenance over the exact files shipped on the release: the rite tarballs/zip,
      # the flat rite-ls binaries, and SHA256SUMS. Attesting the packaged files (not the
      # raw build outputs) means each subject digest matches what a user downloads, so
      # `gh attestation verify <file> --repo rite-ly/rite` succeeds on the artefact itself.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*
