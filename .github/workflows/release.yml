name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            rite_target: linux-amd64
            use_cross: true
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            rite_target: linux-amd64-musl
            use_cross: true
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            rite_target: linux-arm64
            use_cross: true
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-musl
            rite_target: linux-arm64-musl
            use_cross: true
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            rite_target: darwin-amd64
            use_cross: false
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
            use_cross: false
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64
            use_cross: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.rust_target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build rite
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-cli --target ${{ matrix.rust_target }} --features openssl-vendored

      - name: Build rite-ls
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          # Unix: rite as tarball, rite-ls as flat binary
          for target in linux-amd64 linux-amd64-musl linux-arm64 linux-arm64-musl darwin-amd64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            chmod +x "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"

            cp "$ARTS/rite-ls-${target}/rite-ls" "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
            chmod +x "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
          done

          # Windows: rite as zip, rite-ls as flat binary
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          sha256sum "$RELEASE_DIR"/* > "$RELEASE_DIR/SHA256SUMS"

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*

  docker:
    name: Publish Docker image
    needs: [validate, build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rite-linux-*-musl
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/rite-ly/rite
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=max,version=v1
