version: "0.3"
name: "Dice Entropy"
description: |
  Mix participant-supplied dice rolls into the ceremony seed, then issue a
  certificate with a serial drawn from that seed. `rite verify` re-derives the
  recorded entropy and serial from the transcript, so no one has to trust the
  machine's randomness alone.

backends:
  openssl:
    provider: openssl

output:
  certificate:
    type: certificate
    description: "Certificate with a serial derived from the ceremony seed"

roles:
  operator:
    name: "Operator"
    person: "Alice Smith"

sections:
  ceremony:
    name: "Witnessed Entropy"
    role: ${role.operator}
    steps:
      roll_dice:
        action: gather_entropy
        with:
          instruction: "Roll a die 10 times and enter the results in order (for example: 3 1 6 4 2 5 2 6 1 4)."
      generate_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
        creates: keypair
      generate_request:
        action: generate_csr
        backend: openssl
        reads:
          signing_key: ${artifact.keypair}
        with:
          subject: "CN=Example,O=Example Org"
        creates: csr
      issue_cert:
        action: issue_certificate
        backend: openssl
        reads:
          signing_key: ${artifact.keypair}
          csr: ${artifact.csr}
        with:
          profile: root_ca
        creates: certificate
