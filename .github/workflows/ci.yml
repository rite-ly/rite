name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rite-linux-x86_64
            # ls_artifact: rite-ls-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: rite-linux-aarch64
            # ls_artifact: rite-ls-linux-aarch64
          - os: macos-15-intel
            artifact: rite-macos-x86_64
            # ls_artifact: rite-ls-macos-x86_64
          - os: macos-latest
            artifact: rite-macos-aarch64
            # ls_artifact: rite-ls-macos-aarch64
          - os: windows-latest
            artifact: rite-windows-x86_64.exe
            # ls_artifact: rite-ls-windows-x86_64.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: build-${{ matrix.artifact }}

      - name: Build rite
        run: cargo build --release -p rite-cli --features openssl-vendored
      # TODO: Build rite-ls when crates/rite-ls is added to the workspace
      # - name: Build rite-ls
      #   run: cargo build --release -p rite-ls

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/release/rite ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/rite.exe "${{ matrix.artifact }}"

      - name: Upload rite artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1
      # TODO: Upload rite-ls artifact when crates/rite-ls is added
      # - name: Upload rite-ls artifact
      #   uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      #   with:
      #     name: ${{ matrix.ls_artifact }}
      #     path: ${{ matrix.ls_artifact }}
      #     if-no-files-found: error
      #     retention-days: 1
