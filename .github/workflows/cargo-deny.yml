name: Cargo Deny

on:
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - .github/workflows/cargo-deny.yml
  # Dependabot alerts cover published advisories continuously, and
  # what is left here is yanks and RustSec informational advisories.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Advisories, licences, bans and sources, as configured in `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
