# Deliberately maximalist: several acts, four roles, physical and digital
# materials, and long instructions, to show how a dense script prints.
# wrap_and_unwrap.rite.yaml is the example that explains wrapping.
version: "0.3"
name: "Offline Backup Key Ceremony"
description: |
  Generate a backup-wrapping key on an isolated workstation, wrap it to the
  escrow transport key, and transfer the sealed media to its custodian.

backends:
  openssl:
    provider: openssl

parameters:
  ceremony_date:
    type: date
    default: "2026-06-05"
    description: "Scheduled date of the ceremony (YYYY-MM-DD)."
  backup_copies:
    type: integer
    default: 2
    description: "Number of sealed backup copies to produce and distribute."
  escrow_fingerprint:
    type: string
    default: "sha256:0de3cef37d95cd5137ef49d1812e0d012699fd34ea71f3be80161201f68c888a"
    description: |
      SHA-256 of the escrow public key's SPKI DER, obtained from the escrow
      service out of band and printed on the worksheet. The wrap step checks
      the key it is given against this value and refuses to run on a mismatch.

materials:
  ceremony_media:
    type: physical
    title: "Ceremony USB media"
    identifier: "RITE-USB-0007"
    quantity: 2
    description: |
      Write-once USB sticks used to carry the wrapped backup off the air-gapped
      workstation. One copy goes to the off-site vault, one to the custodian.
  tamper_bags:
    type: physical
    title: "Tamper-evident bags"
    identifier: "BAG-2026-Q2"
    quantity: 3
    description: "Numbered tamper-evident bags for sealing each backup copy and the worksheet."
  worksheet:
    type: physical
    title: "Printed ceremony worksheet"
    description: "Pre-printed worksheet where the crypto officer records fingerprints and serials by hand."
  escrow_pubkey:
    type: digital
    path: "test_keys/escrow_public.pem"
    title: "Escrow transport public key"
    description: |
      RSA-4096 public key of the escrow service. The freshly generated backup
      private key is wrapped to this key so it can be archived without ever
      existing in plaintext outside the workstation.

output:
  backup_key:
    type: public_key
    description: "Public half of the backup-wrapping key, safe to distribute."
  wrapped_backup_key:
    type: wrapped_key
    description: "Backup private key wrapped under the escrow transport key."

roles:
  crypto_officer:
    name: "Crypto Officer"
    person: "Alice Rivera"
  witness__1:
    name: "Witness"
    person: "Bob Tanaka"
  witness__2:
    name: "Witness"
    person: "Carol Nguyen"
  custodian:
    name: "Backup Custodian"
    person: "Dan Okoro"

acts:
  - id: opening
    name: "Opening and Environment"
    description: "Establish the trust boundary: confirm isolation, record the machine, and verify the ceremony media before any key material exists."
  - id: generation
    name: "Key Generation"
    description: "Generate the backup-wrapping keypair inside the air-gapped workstation and export its public half."
  - id: protection
    name: "Backup and Escrow"
    description: "Wrap the private key under the escrow key, write it to media, and seal the copies."
  - id: closing
    name: "Attestation and Closing"
    description: "Record attestations on the page and transfer custody of the sealed media."

prerequisites:
  - "Air-gapped workstation is powered on with all network interfaces physically disconnected."
  - "Tamper-evident bag containing the ceremony USB media is present and its seal is intact."
  - "Printed worksheet, two pens, and the witness inventory sheet are on the table."
  - "All participants have verified each other's identity against photo ID."

sections:
  environment:
    act: opening
    name: "Environment Verification"
    description: |
      Confirm the workstation, participants, and ceremony media before key
      generation.
    role: ${role.crypto_officer}
    steps:
      verify_air_gap:
        action: confirm
        with:
          message: |
            Confirm the workstation is isolated from all networks. This step
            sets the trust boundary for the rest of the ceremony.

            Verify each item aloud and have a witness confirm it before
            continuing:
            - All wired network interfaces are physically disconnected
            - Wi-Fi and Bluetooth radios are disabled in firmware
            - No external storage is attached except the ceremony media
            - The screen and keyboard are visible to both witnesses
      verify_time:
        action: clock_check
        with:
          message: "Verify the system clock against an independent reference before any timestamp is recorded."
      record_machine:
        action: machine_info
        with:
          include_machine_id: true
          include_cpu: true
          include_os: true
      inspect_media:
        action: confirm
        with:
          message: |
            Check that the seal of the media bag is intact and its number
            matches the inventory sheet. If either check fails or anything
            looks irregular, halt the ceremony and record a deviation. Open
            the bag only once both witnesses agree the seal is sound.
      readback_bag_serial:
        action: oral_readback
        with:
          value: "RITE-USB-0007"
          format: nato_phonetic
          message: "Read the bag serial aloud using the phonetic alphabet so the witness can confirm it against the inventory sheet."

  keygen:
    act: generation
    name: "Key Generation"
    description: |
      Generate the backup-wrapping keypair. Record its fingerprint before
      wrapping the private key to the escrow transport key.
    role: ${role.crypto_officer}
    steps:
      generate_backup_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
          policy:
            # This key is escrowed below, and a key may not leave the backend
            # unless the step that generated it said it could.
            extractable: true
        creates: backup_keypair
        description: |
          Generate the backup-wrapping keypair. With both witnesses, confirm:
          - The algorithm shown on screen matches ECDSA-P256
          - The fingerprint displayed is copied onto the worksheet exactly
          - No private-key bytes are printed to the terminal at any point
      export_public:
        action: export_public
        backend: openssl
        reads: "${artifact.backup_keypair}"
        creates: backup_key
        description: |
          Export the public key. Read the output filename aloud; a witness
          confirms it is copied to ceremony media, not internal disk.
      readback_fingerprint:
        action: oral_readback
        with:
          value: "${artifact.backup_key}"
          format: hex
          characters: 32
          message: "Read the first 32 hex characters of the public-key fingerprint aloud; the second witness confirms them against the worksheet."

  escrow:
    act: protection
    name: "Escrow Wrapping"
    description: |
      Wrap the private key to the escrow transport key for archival.
    role: ${role.crypto_officer}
    steps:
      wrap_backup_key:
        action: wrap_key
        backend: openssl
        reads:
          key_to_wrap: ${artifact.backup_keypair}
          recipient: ${artifact.escrow_pubkey}
        with:
          expect_recipient: ${param.escrow_fingerprint}
        creates: wrapped_backup_key
        description: |
          Encrypt the backup private key to the escrow transport public key.
          The result is a single CMS file that only the escrow key holder can
          later open.

          Before continuing, confirm with the witnesses that:
          - The escrow key fingerprint matches the value on the worksheet
          - The wrapped output is copied to ceremony media and not retained on another disk

  media:
    act: protection
    name: "Backup Media Handling"
    description: "Write the wrapped backup to each USB copy and seal them, with serials read back and recorded."
    role: ${role.crypto_officer}
    steps:
      write_media:
        action: confirm
        with:
          message: |
            Write the wrapped backup to each USB stick. Produce the number of
            copies specified for this ceremony. For each copy:
            - Verify the file size and name match the original
            - Eject the stick cleanly before removing it
            - Hand the stick to a witness for independent labeling
      seal_media:
        action: confirm
        with:
          message: |
            Put each USB stick and the completed worksheet in separate
            tamper-evident bags. Record each bag number on the worksheet and
            have a witness countersign. Before sealing, confirm:
            - The bag number is legible and recorded
            - Exactly one stick (or the worksheet) is inside
            - Both witnesses have seen the contents before sealing

  attestation:
    act: closing
    name: "Witness Attestation"
    description: "Record each participant's attestation."
    steps:
      witness1_attest:
        action: attest
        role: ${role.witness__1}
        with:
          statement: "I witnessed the generation, export, and escrow wrapping of the backup-wrapping key, and the sealing of the backup media."
      witness2_attest:
        action: attest
        role: ${role.witness__2}
        with:
          statement: "I witnessed the generation, export, and escrow wrapping of the backup-wrapping key, and the sealing of the backup media."
      officer_attest:
        action: attest
        role: ${role.crypto_officer}
        with:
          statement: "I generated the backup-wrapping key and confirm the wrapped backup was written to sealed media as recorded on the worksheet."

  handover:
    act: closing
    name: "Custody Transfer"
    description: |
      Transfer the sealed media to the custodian and verify each bag number.
    role: ${role.custodian}
    steps:
      handover_media:
        action: confirm
        with:
          message: |
            The custodian takes the sealed copies. With both witnesses, confirm:
            - The number of sealed bags matches the number of copies produced
            - Each bag serial matches the worksheet entry
            - No seal shows any sign of tampering

after:
  archive:
    type: archive_materials
    role: crypto_officer
    items:
      - "Ceremony transcript"
      - "Printed worksheet (sealed)"
      - "Backup public key (backup_key.pem)"
    location: "Secure document archive"
  distribute:
    type: distribute_media
    role: custodian
    items:
      - "Sealed backup copy 1 (off-site vault)"
      - "Sealed backup copy 2 (custodian safe)"
    location: "Per the backup distribution policy"
  notify:
    type: notify_stakeholders
    description: "Notify backup operations and update the recovery runbook with the key fingerprint."
