version: "0.3"
name: "Splitting a Secret and Putting It Back"
description: |
  Split a sample secret into three shares, reveal one for copying, then recover
  it from two shares and compare the result. The transcript records the scheme
  used for the split.

backends:
  openssl:
    provider: openssl

materials:
  secret:
    type: digital
    path: "test_data/secret.txt"
    title: "The secret"
    description: "Sample secret to split; replace with suitable material for a real ceremony."

roles:
  officer:
    name: "Ceremony officer"
    person: "Alice Rivera"

sections:
  split:
    name: "Split and Recover"
    role: ${role.officer}
    steps:
      split_the_secret:
        action: split_secret
        backend: openssl
        reads:
          secret: ${artifact.secret}
        with:
          threshold: 2
          shares: 3
        creates: shares
        description: |
          Split the secret into three shares with a threshold of two. Rite
          checks each pair before completing the step, so every share that
          leaves the room is known to work. Shares stay in memory
          and are not written to files.

      hand_over_share_3:
        action: reveal
        reads:
          value: ${artifact.shares.share_3}
        with:
          message: "Recovery share 3"
          note: "Write in block capitals. The sheet goes in the envelope, the envelope in the safe."
          # A share is the secret's 32 bytes plus 3 header bytes: the
          # scheme's version, the threshold and the share's index.
          length: 35
        description: |
          Copy share 3 onto the worksheet generated by `rite script`; the
          share then leaves the screen. The transcript records that it was
          shown, not its contents.

      recover_from_two_shares:
        action: combine_shares
        reads:
          shares:
            - ${artifact.shares.share_3}
            - ${artifact.shares.share_1}
        creates: recovered
        # Any order works, and a single share is refused: each share records
        # the threshold.
        description: |
          Recover the secret from shares 3 and 1. Shares from different splits
          can produce an incorrect result, so the next step checks the recovered
          value. Rite erases it from memory when the run ends.

      confirm_the_secret_came_back:
        action: check_value
        with:
          message: "The recovered secret is the secret that was split."
          actual: ${artifact.recovered | sha256 | hex}
          expected: ${artifact.secret | sha256 | hex}
        description: |
          This example compares against the original secret. In a recovery
          ceremony, compare a value derived from the secret, such as an address
          displayed by the restored device.
