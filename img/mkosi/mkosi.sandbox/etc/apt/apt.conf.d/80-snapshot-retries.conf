// snapshot.debian.org answers 503 and 504 for minutes at a time, and apt's three
// default retries are over within seconds. Eight retries wait about two minutes
// per file. One queue at a time also sends it fewer requests at once.
//
// This file is in the sandbox mkosi runs apt in, and is not part of the image.
Acquire::Retries "8";
Acquire::http::Timeout "60";
Acquire::https::Timeout "60";
Acquire::Queue-Mode "access";
