# EFI system partition: systemd-boot and its configuration from /efi, the UKI
# from /boot/EFI/Linux. 512 MB: FAT32 needs at least 65,525 clusters, and with
# 4 KB clusters 256 MB falls short, so edk2 takes it for FAT16 and refuses it.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot/EFI/Linux:/EFI/Linux
SizeMinBytes=512M
SizeMaxBytes=512M
