version: "0.3"
name: "Sealing a Runbook and Proving It Opens"
description: |
  Encrypt a sample runbook, decrypt it, and compare the result. This example
  contrasts content encryption (`encrypt_data`) with key wrapping (`wrap_key`).

backends:
  openssl:
    provider: openssl

materials:
  runbook:
    type: digital
    path: "test_data/recovery_runbook.txt"
    title: "Recovery runbook"
    description: "The document going into the archive."

roles:
  archivist:
    name: "Archivist"
    person: "Alice Rivera"

output:
  sealed_runbook:
    type: encrypted_data
    description: "The runbook, encrypted to the archive key."

sections:
  seal:
    name: "Seal and Open"
    role: ${role.archivist}
    steps:
      generate_the_archive_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: AES-256
          policy:
            usages: [wrap, unwrap]
        creates: archive_key
        # The archive key never encrypts the document: the backend creates a
        # fresh content-encryption key per message and protects that, which
        # is also the only shape a key-protection device offers.
        description: |
          Generate the AES-256 key that protects the content-encryption key.
          The backend does not receive the runbook itself.

      seal_the_runbook:
        action: encrypt_data
        backend: openssl
        reads:
          data: ${artifact.runbook}
          encryption_key: ${artifact.archive_key}
        creates: sealed_runbook
        # `openssl cms -decrypt` opens the container with no Rite binary.
        description: |
          Encrypt the runbook into a CMS AuthEnvelopedData container. The
          default `CMS-AES-256-GCM` scheme is the only supported output.

      open_the_sealed_runbook:
        action: decrypt_data
        backend: openssl
        reads:
          encrypted_data: ${artifact.sealed_runbook}
          decryption_key: ${artifact.archive_key}
        creates: recovered_runbook
        description: |
          Read the encryption details from the container and check that it is
          addressed to the supplied key before decrypting, so a wrong key fails
          by name.

      confirm_the_runbook_came_back:
        action: check_value
        with:
          message: "The recovered document is the document that went in."
          actual: ${artifact.recovered_runbook | sha256 | hex}
          expected: ${artifact.runbook | sha256 | hex}
        # The decrypted bytes read like any material: a later step could hand
        # them to import_key, which is how a key archived as content becomes a
        # key again.
        description: |
          Compare the SHA-256 digests of the source and recovered runbook.
          The recovered bytes stay in memory and are wiped when the run ends.
