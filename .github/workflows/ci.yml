name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.artifact }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rite-linux-x86_64-gnu
            ls_artifact: rite-ls-linux-x86_64-gnu
            use_cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rite-linux-x86_64-musl
            ls_artifact: rite-ls-linux-x86_64-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rite-linux-aarch64-gnu
            ls_artifact: rite-ls-linux-aarch64-gnu
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: rite-linux-aarch64-musl
            ls_artifact: rite-ls-linux-aarch64-musl
            use_cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: rite-macos-x86_64
            ls_artifact: rite-ls-macos-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rite-macos-aarch64
            ls_artifact: rite-ls-macos-aarch64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rite-windows-x86_64.exe
            ls_artifact: rite-ls-windows-x86_64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: build-${{ matrix.target }}
      # Linux cross-compilation uses `cross` (https://github.com/cross-rs/cross), which wraps
      # `cargo` in a Docker container with the appropriate C toolchain pre-installed. This is
      # needed because openssl-sys (even with vendored feature) requires a C cross-compiler.
      # Alternatives worth evaluating: cargo-zigbuild (no Docker, uses Zig as C compiler),
      # or bare cargo + manually installed gcc-*-linux-gnu toolchains.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build rite
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-cli --target ${{ matrix.target }} --features openssl-vendored

      - name: Build rite-ls
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release -p rite-ls --target ${{ matrix.target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.ls_artifact }}
          path: target/${{ matrix.target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1
