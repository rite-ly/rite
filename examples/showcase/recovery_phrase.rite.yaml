version: "0.3"
name: "Splitting a Recovery Phrase and Giving It Back"
description: |
  Enter a hardware wallet's 24-word recovery phrase, split it into three
  shares, recover it from two, and show it again as words to enter on a spare
  device.

backends:
  openssl:
    provider: openssl

roles:
  officer:
    name: "Ceremony officer"
    person: "Alice Rivera"

sections:
  split:
    name: "Split and Recover"
    role: ${role.officer}
    steps:
      type_the_phrase:
        action: enter_secret
        with:
          message: "The recovery phrase shown on the wallet"
          format: bip39
          length: 24
        creates: phrase
        # The artifact is the 32 bytes of entropy the words encode, not the
        # words, so each share below is two rows of paper32 rather than ten.
        description: |
          Enter the phrase one word at a time, in the order the wallet shows
          it. The first four letters of a word are enough. Rite checks each
          word against the BIP-39 English list, and the last word's checksum
          once the phrase is complete, so a wrong or swapped word is refused.

      split_the_phrase:
        action: split_secret
        backend: openssl
        reads:
          secret: ${artifact.phrase}
        with:
          threshold: 2
          shares: 3
        creates: shares
        description: |
          Split the entropy into three shares with a threshold of two. Rite
          checks each pair before completing the step.

      hand_over_share_1:
        action: reveal
        reads:
          value: ${artifact.shares.share_1}
        with:
          message: "Recovery share 1"
          note: "Write in block capitals. The sheet goes to the first custodian."
          length: 32
        description: |
          Copy share 1 onto the worksheet generated by `rite script`; the
          share then leaves the screen.

      recover_from_two_shares:
        action: combine_shares
        reads:
          shares:
            - ${artifact.shares.share_1}
            - ${artifact.shares.share_2}
        creates: recovered

      confirm_the_phrase_came_back:
        action: check_value
        with:
          message: "The recovered entropy is the entropy that was split."
          actual: ${artifact.recovered | sha256 | hex}
          expected: ${artifact.phrase | sha256 | hex}
        description: |
          This example compares against the original phrase. In a recovery
          ceremony, check the receiving address shown by the restored device.

      show_the_phrase:
        action: reveal
        reads:
          value: ${artifact.recovered}
        with:
          message: "Type these words into the spare device, in order"
          format: bip39
          length: 24
        # Words come from the English list, which hardware wallets use. The
        # same entropy in another language's list is a different wallet.
        description: |
          Enter the 24 numbered words on the spare device in order; the words
          then leave the screen.
