name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_date: ${{ steps.commit.outputs.date }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve commit metadata
        id: commit
        # Stamped into every binary (native + docker) via RITE_BUILD_COMMIT /
        # RITE_BUILD_COMMIT_DATE so all artefacts for this release report the
        # same commit format. Short SHA via %h; date via %cd --date=short.
        run: git log -1 --format='sha=%h%ndate=%cd' --date=short >> "$GITHUB_OUTPUT"

  build-native:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rust_target: x86_64-apple-darwin
            rite_target: darwin-amd64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.rust_target }}

      - name: Build rite
        run: cargo build --release -p rite --target ${{ matrix.rust_target }} --features openssl-vendored

      - name: Build rite-ls
        run: cargo build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  build-linux-and-image:
    name: Build Linux binaries and push image
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        # Annotate the index (manifest list) as well as the per-platform manifests.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/rite-ly/rite
          # latest=auto applies the `latest` tag only when the ref is a stable semver.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # Static OCI labels listed explicitly so all metadata lives in one place.
          # metadata-action also auto-fills `created`, `revision`, and `version` at build time.
          labels: |
            org.opencontainers.image.title=rite
            org.opencontainers.image.description=DSL and runtime for cryptographic key ceremonies
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only
          bake-target: image

      - name: Bake binaries + image
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
        with:
          # Provenance is attested via Sigstore (actions/attest, below); disable the
          # BuildKit in-registry provenance that bake-action injects by default so the
          # image carries a single, signed attestation rather than two mechanisms.
          provenance: false
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: default
          set: |
            image.output=type=registry,push=true
            *.cache-from=type=gha,scope=release-docker
            *.cache-to=type=gha,mode=max,scope=release-docker

      # Pull the pushed multi-arch index digest out of the bake metadata for the
      # `image` target. Done in a dedicated step (rather than an inline fromJSON
      # expression) so the resolved digest is visible in the logs.
      - name: Resolve image digest
        id: image
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest=$(jq -r '.image["containerimage.digest"]' <<<"$BAKE_METADATA")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sigstore-signed provenance for the pushed image, bound to the multi-arch
      # index digest and stored as an OCI referrer alongside it (verifiable with
      # `gh attestation verify oci://...`). Same mechanism as the binaries below.
      - name: Attest image provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/rite-ly/rite
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Stage Linux binaries for upload
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          mv dist/amd64/rite    target/x86_64-unknown-linux-musl/release/rite
          mv dist/amd64/rite-ls target/x86_64-unknown-linux-musl/release/rite-ls
          mv dist/arm64/rite    target/aarch64-unknown-linux-musl/release/rite
          mv dist/arm64/rite-ls target/aarch64-unknown-linux-musl/release/rite-ls

      - name: Upload rite-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

      - name: Upload rite-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rite-ls-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

  release:
    name: Create Release
    needs: [validate, build-native, build-linux-and-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          # Unix: rite as tarball, rite-ls as flat binary
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            chmod +x "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"

            cp "$ARTS/rite-ls-${target}/rite-ls" "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
            chmod +x "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
          done

          # Windows: rite as zip, rite-ls as flat binary
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          sha256sum "$RELEASE_DIR"/* > "$RELEASE_DIR/SHA256SUMS"

      # Provenance over the exact files shipped on the release: the rite tarballs/zip,
      # the flat rite-ls binaries, and SHA256SUMS. Attesting the packaged files (not the
      # raw build outputs) means each subject digest matches what a user downloads, so
      # `gh attestation verify <file> --repo rite-ly/rite` succeeds on the artefact itself.
      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: release/*

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*
