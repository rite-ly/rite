version: "0.3"
name: "Detached Signature over a Release Manifest"
description: |
  Sign a release manifest with a ceremony key and verify the detached
  signature. Signing uses the backend that holds the private key; verification
  needs only the public key.

backends:
  openssl:
    provider: openssl

materials:
  manifest:
    type: digital
    path: "test_data/release_manifest.txt"
    description: "Release manifest to sign."

output:
  manifest_signature:
    type: document
    description: "Detached signature over the release manifest."

roles:
  signer:
    name: "Release Signer"
    person: "Alice Rivera"
  witness:
    name: "Witness"
    person: "Bob Jones"

sections:
  produce:
    name: "Sign the Manifest"
    role: ${role.signer}
    steps:
      generate_signing_key:
        action: generate_key
        backend: openssl
        with:
          algorithm: ECDSA-P256
        creates: signing_keypair
        description: "Generate the ECDSA-P256 signing keypair."

      sign_manifest:
        action: sign_data
        backend: openssl
        reads:
          key: ${artifact.signing_keypair}
          data: ${artifact.manifest}
        with:
          message: "Signing the release manifest."
        creates: manifest_signature
        # An ECDSA-P256 key signs with ECDSA-SHA256. `algorithm:` matters only
        # for an RSA key, which can sign under PKCS#1 v1.5 or PSS.
        description: |
          Sign the manifest with the algorithm selected from the key.

  confirm:
    name: "Verify the Signature"
    role: ${role.witness}
    steps:
      verify_manifest_signature:
        action: verify_signature
        reads:
          key: ${artifact.signing_keypair}
          data: ${artifact.manifest}
          signature: ${artifact.manifest_signature}
        with:
          message: "Checking the signature against the signing key."
        # The same step checks a signature made on a smart card, or one that
        # arrived from outside the ceremony.
        description: |
          Verify the detached signature with the keypair's public key. No
          backend is needed for this check.

      witness_confirms:
        action: confirm
        with:
          message: "Witness: did you observe the signature being produced and verified?"
