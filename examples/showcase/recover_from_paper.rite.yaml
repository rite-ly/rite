version: "0.3"
name: "Recovering a Secret from Paper"
description: |
  Enter shares 1 and 3 from the included sheets, recover the secret, and check
  it against the digest recorded at the split. The sheets are in
  `test_data/recovery_sheets.txt`; they match `split_and_combine.rite.yaml`.

parameters:
  expected_digest:
    type: string
    default: "17c130ea49ca769138601fbba7350589b67609bdcda7d8951bcd2800ccc79ac4"
    description: |
      SHA-256 digest recorded at the split and kept separate from the shares.
      It lets the custodians check the recovery without retaining the secret.

materials:
  sheet_1:
    type: physical
    title: "Sheet for recovery share 1"
    description: "Recovery share 1 worksheet."
  sheet_3:
    type: physical
    title: "Sheet for recovery share 3"
    description: "Recovery share 3 worksheet."

roles:
  officer:
    name: "Ceremony officer"
    person: "Alice Rivera"

sections:
  recover:
    name: "Recover"
    role: ${role.officer}
    steps:
      type_share_1_back:
        action: enter_share
        with:
          message: "Recovery share 1"
          note: "Enter the rows from the first custodian's worksheet."
          length: 35
        creates: share_1
        description: |
          Enter the first custodian's share, one row at a time. Check any
          corrected characters against the sheet. The transcript records the
          share index and repaired rows, not the share contents.

      type_share_3_back:
        action: enter_share
        with:
          message: "Recovery share 3"
          note: "Enter the rows from the third custodian's worksheet."
          length: 35
        creates: share_3

      recover_the_secret:
        action: combine_shares
        reads:
          shares:
            - ${artifact.share_1}
            - ${artifact.share_3}
        creates: recovered
        # Each share records the threshold and its own index, so the order
        # of the list does not matter.
        description: |
          Recover the secret from shares 1 and 3. Shares from different splits
          can produce an incorrect result, so the next step checks the digest.

      confirm_it_is_the_secret:
        action: check_value
        with:
          message: "The recovered secret has the digest recorded at the split."
          actual: ${artifact.recovered | sha256 | hex}
          expected: ${param.expected_digest}
        description: |
          Compare the recovered secret's digest with the value recorded at the
          split. A real wallet recovery could instead verify the address shown
          by the restored device.
