# GRUB menu for the Rite ceremony image. Text-mode menu only: no live-build
# graphical theme, no distribution logo or version panel.

source /boot/grub/config.cfg

# config.cfg above sets the live-build graphical theme. Drop it and use the
# plain text menu.
unset theme

set default=0
set timeout=5
set timeout_style=menu

# The ceremony session in cage and foot, with the memory protections that
# depend on the hardware (https://docs.kernel.org/admin-guide/kernel-parameters.html):
#
# mem_encrypt=on
#   AMD Secure Memory Encryption on CPUs that have it: DRAM is encrypted with a
#   key held in the AMD Secure Processor, so memory chips read outside the
#   machine show ciphertext. No effect on Intel or ARM64, or in a VM that does
#   not expose SME. Some drivers, graphics among them, fail with it on.
#
# intel_iommu=on iommu.passthrough=0 iommu.strict=1
#   DMA protection against PCIe and Thunderbolt peripherals reading arbitrary
#   memory. intel_iommu=on turns on Intel VT-d, which the kernel may leave off
#   by default; AMD-Vi is on by default when the hardware has it. The iommu.*
#   options apply to every IOMMU, ARM64 SMMUs included: passthrough=0
#   translates DMA for every device instead of mapping it one to one, and
#   strict=1 invalidates a device's mappings as soon as they are released.
#   Without IOMMU hardware, or with it disabled in firmware, they do nothing.
#   Firmware with broken IOMMU tables may fail to boot with them.
menuentry "Rite Ceremony" --hotkey=r {
    linux  @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE@ mem_encrypt=on intel_iommu=on iommu.passthrough=0 iommu.strict=1 quiet
    initrd @INITRD_LIVE@
}

# For machines where the main entry does not boot or does not display: the same
# session on the text console, without the hardware-dependent options above,
# and with the boot progress shown. loglevel=3 keeps kernel messages other than
# errors off the console, where they would print over the ceremony, for example
# when a device is plugged in.
menuentry "Rite Ceremony (safe mode)" --hotkey=s {
    linux  @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE@ rite.console loglevel=3
    initrd @INITRD_LIVE@
}

menuentry "Power off" --hotkey=p {
    halt
}
