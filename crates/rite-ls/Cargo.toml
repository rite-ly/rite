[package]
name = "rite-ls"
description = "Language server for the Rite ceremony DSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lsp", "language-server", "ceremony", "rite"]
categories = ["security", "development-tools"]
publish = true

[[bin]]
name = "rite-ls"
path = "src/main.rs"

[dependencies]
rite-resolver = { workspace = true }
rite-model = { workspace = true }
tower-lsp-server = { workspace = true }
tokio = { workspace = true, features = ["macros", "io-std", "rt-multi-thread"] }
dashmap = { workspace = true }
