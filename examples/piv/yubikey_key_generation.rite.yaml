version: "0.3"
name: "Signing Key Generation on a YubiKey"
description: |
  Generate a signing key in PIV slot 9C of a prepared YubiKey, have the
  YubiKey attest that it generated the key, and export its public key.

backends:
  token:
    provider: yubikey

credentials:
  card_pin:
    backend: token
    grants: user
    source: entered
    description: "PIV PIN of the YubiKey, known to the key officer."
  # Prepared with `ykman piv access change-management-key --generate --protect`:
  # the card stores the management key and releases it after the PIN.
  card_admin:
    backend: token
    grants: admin
    source:
      protected_by: "${credential.card_pin}"
    description: "PIV management key, stored on the card behind the PIN."

output:
  signing_key:
    type: public_key
    description: "Public half of the signing key generated in slot 9C"
  signing_key_attestation:
    type: attestation
    description: "YubiKey attestation of the slot 9C key"

roles:
  officer:
    name: "Key Officer"
    person: "Alice Smith"
  witness:
    name: "Witness"
    person: "Bob Jones"

prerequisites:
  - "A YubiKey with firmware 5.3 or later is inserted, its management key protected by the PIN"

sections:
  generate:
    name: "Generate the Signing Key"
    role: ${role.officer}
    steps:
      confirm_token:
        action: confirm
        with:
          message: "Confirm the inserted YubiKey is assigned to this ceremony."
      # Asks for the PIN, then has the card release its management key. The
      # transcript records both authentications, never a value, and whether
      # the management key is still the factory default.
      admin_login:
        action: authenticate
        backend: token
        reads:
          credential: "${credential.card_admin}"
      make_signing_key:
        action: generate_key
        backend: token
        with:
          algorithm: ECDSA-P256
          slot: "9c"
          # The PIN before each signature, and a touch within 15 seconds of
          # it. Both are fixed once the key exists; the record shows what the
          # card reports it set.
          policy:
            authentication: per_use
            presence: cached
        creates: signing_key
        description: "Generate the signing key in slot 9C, replacing any key there."
      attest_signing_key:
        action: attest_key
        backend: token
        reads:
          key: "${artifact.signing_key}"
        creates: signing_key_attestation
        description: "Have the card attest that it generated the key."

  attestation:
    name: "Witness Attestation"
    steps:
      witness_attest:
        action: attest
        role: ${role.witness}
        with:
          statement: "I witnessed the signing key being generated on the YubiKey."
