version: "0.3"
name: "Release Signing with YubiKey PIV"
description: |
  Sign a release manifest with the PIV key in slot 9C. Read its certificate,
  request a YubiKey attestation certificate, enter the PIN, produce a detached
  signature, and check it off the card.

backends:
  token:
    provider: yubikey
  # The signature is checked in software: verifying needs only a public key,
  # and a check by something other than the card that signed means more.
  software:
    provider: openssl

materials:
  # A key provisioned on the card before the ceremony. Nothing reads the card
  # when the run starts: the first step that uses the key asks the card for
  # its public key and checks the algorithm, and records a `key_bound` fact.
  signing_key:
    type: backend_key
    backend: token
    id: "piv:9c"
    algorithm: ECDSA-P256
    # Pin the key once it is known, so another card cannot stand in for it:
    # fingerprint: "sha256:..."
    description: "Release signing key, generated on the YubiKey in slot 9C."
  manifest:
    type: bytes
    path: "test_data/release_manifest.txt"
    description: "Release manifest to be signed."

output:
  signing_cert:
    type: certificate
    description: "Signing key certificate read from PIV slot 9C"
  attestation_cert:
    type: certificate
    description: "YubiKey attestation certificate for slot 9C"
  manifest_signature:
    type: signature
    description: "Detached ECDSA signature over the release manifest"

roles:
  signer:
    name: "Release Signer"
    person: "Alice Smith"
  witness:
    name: "Witness"
    person: "Bob Jones"

acts:
  - id: opening
    name: "Opening"
    description: "Verify the operator and the inserted token before signing."
  - id: signing
    name: "Signing"
    description: "Read the certificate, attest the key, sign the manifest, and check the signature."
  - id: closing
    name: "Closing"

prerequisites:
  - "A YubiKey with firmware 5.3 or later is inserted, and slot 9C holds the release signing key and its certificate"

sections:
  environment:
    act: opening
    name: "Environment Verification"
    role: ${role.signer}
    steps:
      verify_time:
        action: clock_check
        with:
          message: "Verify the system clock before recording timestamps."
      confirm_token:
        action: confirm
        with:
          message: "Confirm the inserted YubiKey is assigned to this ceremony."

  read_and_attest:
    act: signing
    name: "Read Certificate and Attest Key"
    role: ${role.signer}
    steps:
      read_signing_cert:
        action: piv_read_certificate
        backend: token
        with:
          slot: "9c"
          message: "Read the signing certificate from slot 9C"
        creates: signing_cert
        description: "Read the X.509 certificate stored alongside the signing key."
      attest_signing_key:
        action: yubikey_attest_slot
        backend: token
        with:
          slot: "9c"
        creates: attestation_cert
        description: "Request the attestation certificate showing the slot 9C key was generated on the device."

  sign:
    act: signing
    name: "Sign the Manifest"
    role: ${role.signer}
    steps:
      # Entering the PIN is its own step, the signer's act of authorizing
      # the signature. The transcript records it, never the PIN. Slot 9C
      # clears the PIN after each use, so it comes right before the one
      # signature; a second signature would take a second `enter_pin`.
      unlock_card:
        action: enter_pin
        backend: token
        with:
          message: "Enter the PIV PIN to authorize signing the release manifest."
      sign_manifest:
        action: sign_data
        backend: token
        reads:
          key: "${artifact.signing_key}"
          data: "${artifact.manifest}"
        creates: manifest_signature
        description: "Produce a detached ECDSA-P256 signature over the manifest."
      # Checked against the certificate read from the card, as a relying
      # party will: it also shows the certificate is for the key that signed.
      check_signature:
        action: verify_signature
        backend: software
        reads:
          key: "${artifact.signing_cert}"
          data: "${artifact.manifest}"
          signature: "${artifact.manifest_signature}"
        description: "Check the signature in software against the slot 9C certificate."

  attestation:
    act: closing
    name: "Witness Attestation"
    steps:
      witness_attest:
        action: attest
        role: ${role.witness}
        with:
          statement: "I witnessed the release manifest being signed with the YubiKey."
      signer_attest:
        action: attest
        role: ${role.signer}
        with:
          statement: "Release manifest signed with the on-device PIV key in slot 9C."

after:
  archive:
    type: archive_materials
    role: signer
    items:
      - "Ceremony transcript"
      - "Signing certificate (signing_cert.pem)"
      - "Attestation certificate (attestation_cert.pem)"
      - "Manifest signature (manifest_signature.bin)"
    location: "Secure document archive"
