name: Rite Live

# Runs on main, and on a pull request only if it changes what the jobs build.
# They download the Debian packages from snapshot.debian.org, whose outages would
# otherwise fail unrelated pull requests. A change that breaks the image in
# another way shows on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - img/**
      - Dockerfile
      - docker-bake.hcl
      - examples/showcase/demo.rite.yaml
      - .github/workflows/rite-live.yml

permissions:
  contents: read

jobs:
  # Runs the commands of docs/development/img.md for both architectures, so a
  # broken Rite Live build shows before a release tag. The release jobs that
  # publish rite-img and the Live systems (release.yml) run only on a tag. The
  # caches are written on main and only read by pull requests.
  live-system:
    name: Live system (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The glibc binary shipped in the Live systems and linux-<arch>-glibc
      # tarballs. The build runs it on the oldest distribution it supports. The
      # system must provide the libraries it links, which a static binary would
      # not check.
      - name: Build the glibc rite binary
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: ./docker-bake.hcl
          targets: binary-glibc-${{ matrix.arch }}
          set: |
            *.cache-from=type=gha,scope=ci-glibc-${{ matrix.arch }}
            ${{ github.event_name == 'push' && format('*.cache-to=type=gha,mode=max,scope=ci-glibc-{0}', matrix.arch) || '' }}

      - name: Build the rite-img image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: img
          tags: rite-img
          load: true
          cache-from: type=gha,scope=ci-img-tooling-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=ci-img-tooling-{0}', matrix.arch) || '' }}

      - name: Build the Live system
        run: |
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" rite-img build-system \
            --binary dist/glibc-${{ matrix.arch }}/rite \
            --output out/live.img \
            --roothash out/live.roothash
          grep -qxE '[0-9a-f]{64}' out/live.roothash

      - name: Add a ceremony
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --system out/live.img \
            --definition examples/showcase/demo.rite.yaml \
            --output out/demo.img

      # docs/development/img.md says build-img is reproducible.
      - name: Check that build-img is reproducible
        run: |
          docker run --rm -v "$PWD:/work" rite-img build-img \
            --system out/live.img \
            --definition examples/showcase/demo.rite.yaml \
            --output out/demo-again.img
          cmp out/demo.img out/demo-again.img

      - name: Read back the outputs partition
        run: |
          docker run --rm -v "$PWD:/work" rite-img extract \
            --image out/demo.img \
            --output out/outputs

      # apt has been killed by SIGKILL during snapshot.debian.org outages, and
      # mkosi only reports the signal. The container shares the runner's kernel,
      # so this shows whether the kernel ran out of memory.
      - name: Show kernel out-of-memory events
        if: failure()
        run: sudo dmesg -T | grep -iE 'out of memory|oom-kill|killed process' || echo "No out-of-memory events."
