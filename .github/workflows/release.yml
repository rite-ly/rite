name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.sha }}
      commit_date: ${{ steps.commit.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches workspace version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Version mismatch: tag=${VERSION}, Cargo.toml=${CARGO_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve commit metadata
        id: commit
        # Stamped into every binary (native + docker) via RITE_BUILD_COMMIT /
        # RITE_BUILD_COMMIT_DATE so all artefacts for this release report the
        # same commit format. Short SHA via %h; date via %cd --date=short.
        run: git log -1 --format='sha=%h%ndate=%cd' --date=short >> "$GITHUB_OUTPUT"

  build-native:
    name: Build (${{ matrix.rite_target }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    env:
      RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
      RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            rust_target: aarch64-apple-darwin
            rite_target: darwin-arm64
          - os: windows-2025
            rust_target: x86_64-pc-windows-msvc
            rite_target: windows-amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.rust_target }}

      - name: Build rite
        # PC/SC is a system framework on macOS (PCSC.framework) and Windows
        # (WinSCard), so the native release binaries carry the piv/yubikey
        # backends. Only the static musl Linux tarballs stay software-only.
        run: cargo build --release -p rite --target ${{ matrix.rust_target }} --features openssl-vendored,piv,yubikey

      - name: Build rite-ls
        run: cargo build --release -p rite-ls --target ${{ matrix.rust_target }}

      - name: Upload rite artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      - name: Upload rite-ls artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-ls-${{ matrix.rite_target }}
          path: target/${{ matrix.rust_target }}/release/rite-ls${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  # Static, software-only Linux tarballs. The rust-musl-cross toolchain images
  # are linux/amd64 (pinned via --platform in the Dockerfile), so both the amd64
  # and arm64 musl targets cross-compile on an amd64 host with no QEMU. The
  # hardware backends ship in the native binaries and the glibc image, not here.
  build-linux-musl:
    name: Build Linux musl binaries
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bake musl binaries
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          RITE_BUILD_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          RITE_BUILD_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
        with:
          files: ./docker-bake.hcl
          targets: binaries
          set: |
            *.cache-from=type=gha,scope=release-musl
            *.cache-to=type=gha,mode=max,scope=release-musl

      - name: Stage Linux binaries for upload
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release target/aarch64-unknown-linux-musl/release
          mv dist/amd64/rite    target/x86_64-unknown-linux-musl/release/rite
          mv dist/amd64/rite-ls target/x86_64-unknown-linux-musl/release/rite-ls
          mv dist/arm64/rite    target/aarch64-unknown-linux-musl/release/rite
          mv dist/arm64/rite-ls target/aarch64-unknown-linux-musl/release/rite-ls

      - name: Upload rite-linux-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-amd64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-ls-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

      - name: Upload rite-linux-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite
          if-no-files-found: error

      - name: Upload rite-ls-linux-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-ls-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/rite-ls
          if-no-files-found: error

  # The Docker images, built one arch per runner so each compiles natively:
  # amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm (no QEMU). Each build is
  # pushed to ghcr.io by digest only; the merge job below assembles the tagged
  # multi-arch manifest list.
  #
  # - rite: the glibc runtime image. The glibc build dynamically links
  #   libpcsclite and system OpenSSL, so the image carries the piv/yubikey
  #   backends.
  # - rite-img: the tools that build ceremony images (img/,
  #   docs/development/img.md). The base images below are built with these
  #   exact images.
  build-image:
    name: Build image ${{ matrix.image }} (${{ matrix.arch }})
    needs: [validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [rite, rite-img]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: rite
            context: .
            target: release
            build-args: |
              CARGO_BUILD_ARGS=--features piv,yubikey
              RITE_BUILD_COMMIT=${{ needs.validate.outputs.commit_sha }}
              RITE_BUILD_COMMIT_DATE=${{ needs.validate.outputs.commit_date }}
            description: DSL and runtime for cryptographic key ceremonies
            digests: image-digest
            cache: release-image
          - image: rite-img
            context: img
            target: ''
            build-args: ''
            description: Builds bootable Rite ceremony images
            digests: img-tooling-digest
            cache: release-img-tooling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels + annotations for this single-platform manifest. The index
      # tags and index-level annotations are applied in the merge job.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rite-ly/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ matrix.build-args }}
          # Provenance is attested via Sigstore (actions/attest, in the merge
          # job); disable BuildKit's in-registry provenance so the index carries
          # a single signed attestation.
          provenance: false
          # The rite image's file system is also written to rite-rootfs, so the
          # base images below take the binary of this exact build.
          outputs: |
            type=image,name=ghcr.io/rite-ly/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
            ${{ matrix.image == 'rite' && 'type=local,dest=rite-rootfs' || '' }}
          cache-from: type=gha,scope=${{ matrix.cache }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}-${{ matrix.arch }}

      - name: Upload the glibc binary
        if: matrix.image == 'rite'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rite-glibc-${{ matrix.arch }}
          path: rite-rootfs/usr/local/bin/rite
          if-no-files-found: error
          retention-days: 7

      # Export the per-arch digest as a filename-only marker; the merge job
      # collects both and feeds them to `imagetools create`.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.digests }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Kept until the merge job is approved, which can be days after the
          # build.
          retention-days: 7

  # The base image for each architecture, built on a native runner by the
  # rite-img image pushed above. Its rite is the glibc binary of the rite image
  # of the same run: built on Debian trixie, as the base system is, with the
  # piv/yubikey backends the musl binary lacks. The Debian packages come from
  # the snapshot.debian.org date in img/mkosi/mkosi.conf. The release ships it
  # compressed with xz, and the packages it holds as a JSON manifest.
  build-base:
    name: Build base image (${{ matrix.arch }})
    needs: [validate, build-image]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      BASE: rite-base-${{ needs.validate.outputs.version }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download the rite-img digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: img-tooling-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - name: Download the glibc binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rite-glibc-${{ matrix.arch }}
          path: work

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the base image
        working-directory: work
        run: |
          digest=$(basename "${{ runner.temp }}"/digests/*)
          docker run --rm --privileged -v "$PWD:/work" \
            "ghcr.io/rite-ly/rite-img@sha256:${digest}" build-base \
            --binary rite --output "$BASE.img" --manifest "$BASE.manifest.json"
          # The container writes the image as root; compressing to stdout
          # leaves the runner user owning the .xz, where xz in place would try
          # to copy root's group onto it and fail.
          xz -T0 -c "$BASE.img" > "$BASE.img.xz"

      - name: Upload the base image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-${{ matrix.arch }}
          path: |
            work/${{ env.BASE }}.img.xz
            work/${{ env.BASE }}.manifest.json
          if-no-files-found: error
          # The image is already compressed.
          compression-level: 0
          # Kept for a re-run of the release job, as the digests are.
          retention-days: 7

  # Assemble the per-arch digests into the tagged multi-arch manifest list and
  # attest the resulting index, once per image. Until this job runs, the images
  # are on ghcr.io by digest only, with no tag; the `docker` environment holds
  # the approval, after the draft release exists.
  merge-image:
    name: Merge and push image manifest (${{ matrix.image }})
    needs: [build-image, release]
    runs-on: ubuntu-24.04
    environment: docker
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rite
            digests: image-digest-*
            description: DSL and runtime for cryptographic key ceremonies
          - image: rite-img
            digests: img-tooling-digest-*
            description: Builds bootable Rite ceremony images
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ matrix.digests }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags + index-level annotations for the manifest list. latest=auto applies
      # the `latest` tag only on a stable semver ref; annotations are derived from
      # the same OCI labels and attached to the index by imagetools.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/rite-ly/${{ matrix.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/rite-ly/rite
            org.opencontainers.image.url=https://ritely.io
            org.opencontainers.image.documentation=https://ritely.io/docs
            org.opencontainers.image.vendor=Rite-ly
            org.opencontainers.image.licenses=GPL-3.0-only

      # Bash arrays (not word-split command substitution) so tag and annotation
      # values containing spaces survive intact.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<<"$METADATA")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done \
            < <(jq -r '.annotations[]' <<<"$METADATA")
          for digest in *; do
            args+=("ghcr.io/rite-ly/${{ matrix.image }}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      # Resolve the pushed index digest to bind the attestation to it.
      - name: Resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/rite-ly/${{ matrix.image }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Sigstore-signed provenance for the pushed image, bound to the multi-arch
      # index digest and stored as an OCI referrer alongside it (verifiable with
      # `gh attestation verify oci://...`). Same mechanism as the binaries.
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/rite-ly/${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # A storage record lists the image in the organization's artifact
          # metadata. Nothing reads it, and it would need the
          # artifact-metadata: write permission.
          create-storage-record: false

  release:
    name: Create Release
    needs: [validate, build-native, build-linux-musl, build-image, build-base]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/

      - name: Package release files
        shell: bash
        run: |
          mkdir release/
          RELEASE_DIR="$(pwd)/release"
          ARTS="$(pwd)/artifacts"

          # Unix: rite as tarball, rite-ls as flat binary
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            tmp=$(mktemp -d)
            cp "$ARTS/rite-${target}/rite" "$tmp/rite"
            chmod +x "$tmp/rite"
            tar -czf "$RELEASE_DIR/rite-${VERSION}-${target}.tar.gz" -C "$tmp" rite
            rm -rf "$tmp"

            cp "$ARTS/rite-ls-${target}/rite-ls" "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
            chmod +x "$RELEASE_DIR/rite-ls-${VERSION}-${target}"
          done

          # Windows: rite as zip, rite-ls as flat binary
          tmp=$(mktemp -d)
          cp "$ARTS/rite-windows-amd64/rite.exe" "$tmp/rite.exe"
          zip -j "$RELEASE_DIR/rite-${VERSION}-windows-amd64.zip" "$tmp/rite.exe"
          rm -rf "$tmp"
          cp "$ARTS/rite-ls-windows-amd64/rite-ls.exe" "$RELEASE_DIR/rite-ls-${VERSION}-windows-amd64.exe"

          # Base images, the input of build-img (docs/development/img.md), and
          # the package manifest of each
          for arch in amd64 arm64; do
            cp "$ARTS/base-${arch}/rite-base-${VERSION}-${arch}.img.xz" "$RELEASE_DIR/"
            cp "$ARTS/base-${arch}/rite-base-${VERSION}-${arch}.manifest.json" "$RELEASE_DIR/"
          done

          # Bare file names, so sha256sum --check works in the directory the
          # files are downloaded to.
          (cd "$RELEASE_DIR" && sha256sum -- * > SHA256SUMS)

      # Provenance over the exact files shipped on the release: the rite tarballs/zip,
      # the flat rite-ls binaries, the base images and their package manifests, and
      # SHA256SUMS. Attesting the packaged files (not the raw build outputs) means each
      # subject digest matches what a user downloads, so
      # `gh attestation verify <file> --repo rite-ly/rite` succeeds on the artefact itself.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "" \
            release/*

  # Every crate, at the release version, once the binaries and the draft
  # release exist. The `crates.io` environment holds the approval, and each
  # crate trusts this workflow and environment on crates.io, so the job gets a
  # token that lasts for this run only, with no stored secret.
  publish-crates:
    name: Publish crates
    needs: [release]
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        # Each crate is built from its package: rite-openssl links OpenSSL and
        # rite-piv links PC/SC.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libpcsclite-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Build every crate from its package before the token is requested. The
      # dependencies are then cached, so the build `cargo publish` repeats
      # takes little of the token's lifetime.
      - name: Package and verify
        run: cargo package --workspace

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Fails on a version already on crates.io. A publish that stops part way
      # is not resumed: the crates it uploaded are yanked and the next patch
      # release publishes the whole set.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
