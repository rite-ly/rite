# img/mkosi/mkosi.conf
# The Live system: Debian trixie with rite and the ceremony session, as a GPT
# disk image. The root file system is read-only and checked by dm-verity on
# every read; its root hash is on the kernel command line of a unified kernel
# image (UKI), which systemd-boot starts. build-system.sh runs mkosi on this
# directory and adds the rite binary.
#
# mkosi: https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md
# Target: Debian trixie, Linux 6.12. When upgrading the distribution or kernel,
# re-validate the kernel parameters below and in mkosi.uki-profiles/.

[Distribution]
Distribution=debian
Release=trixie
# non-free-firmware: the firmware some wired network cards need (Packages=
# below).
Repositories=main non-free-firmware
# Every repository, debian-security included, as snapshot.debian.org served it
# at this time, so a later build installs the same packages. Moving the date is
# how package updates come in; mkosi latest-snapshot prints the newest. Two
# builds still differ in timestamps: the Live system is not reproducible.
Snapshot=20261022T203737Z

[Output]
Format=disk
ImageId=rite
# The root hash in its own file, for build-system to print, and the package
# list.
SplitArtifacts=roothash
ManifestFormat=json
# The release compresses the image with xz.
CompressOutput=no
# With a fixed seed, the partition UUIDs and the dm-verity salt are the same in
# every build.
Seed=0e3d1a54-6f2b-4c2f-9a1e-7c3b5d9f2a10

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
# Built here rather than taken from the distribution: the root hash on its
# command line is this image's. Unsigned, so the machine boots it with Secure
# Boot off (docs/development/img.md).
UnifiedKernelImages=unsigned
SecureBoot=no
# No way in but the ceremony session and the second terminal.
Autologin=no
Ssh=never
# Man pages, for the operator (man-db in the toolbox below).
WithDocs=yes
Locale=C.UTF-8
Keymap=us
Timezone=UTC
Hostname=rite
# mkosi's default initrd with the storage, USB and file system modules only,
# instead of every module of the kernel.
KernelInitrdModules=default
RemoveFiles=/var/cache/apt /var/lib/apt/lists

# The command line of the main boot entry, "Rite Ceremony". The safe mode entry
# adds to it (mkosi.uki-profiles/safe.conf). The UKI holds the command line, and
# the boot menu cannot edit it (loader.conf). With Secure Boot off, a program
# that starts the UKI on its own, such as a UEFI shell, can still pass another
# command line in its place.
# https://docs.kernel.org/admin-guide/kernel-parameters.html
#
# systemd.volatile=overlay
#   Puts a memory file system over the read-only root, so the system can write
#   where it needs to. Nothing written reaches the medium, except the outputs
#   partition.
#
# systemd.verity_root_options=panic-on-corruption
#   Stops the machine when a block of the root does not match its hash, instead
#   of failing that one read and carrying on.
#
# console=tty0 systemd.getty_auto=0
#   The display is the only console. systemd starts no login on serial or
#   hypervisor consoles (hvc0) it finds on its own.
#
# quiet
#   Keeps kernel messages other than errors off the console, where they would
#   print over the ceremony, for example when a device is plugged in.
#
# init_on_free=1
#   Zeroes kernel memory pages when they are freed, so secrets in freed memory
#   do not linger until the page is reused.
#
# slab_nomerge
#   Gives each kind of kernel object its own slab cache, so a heap overflow in
#   one cannot reach objects of another kind placed next to it.
#
# vsyscall=none
#   Removes the vsyscall page, code at a fixed address on x86-64 that exploits
#   use as gadgets. Breaks only glibc older than 2.14. Ignored on ARM64.
#
# debugfs=off
#   No /sys/kernel/debug, which exposes kernel internals.
#
# randomize_kstack_offset=1
#   A random kernel stack offset at each system call, whatever the kernel's
#   build default.
#
# AMD memory encryption (mem_encrypt=on) stays off, the Debian default: with
# it, the nouveau driver of NVIDIA GPUs leaves the display black.
#
# intel_iommu=on iommu.passthrough=0 iommu.strict=1
#   DMA protection against PCIe and Thunderbolt peripherals reading arbitrary
#   memory. intel_iommu=on turns on Intel VT-d, which the Debian kernel leaves
#   off unless the firmware asks for it; AMD-Vi is on by default when the
#   hardware has it. The iommu.* options apply to every IOMMU, ARM64 SMMUs
#   included: passthrough=0 translates DMA for every device instead of mapping
#   it one to one, and strict=1 invalidates a device's mappings as soon as
#   they are released. Without IOMMU hardware they do nothing; on firmware
#   with broken IOMMU tables, safe mode turns them off.
#
# module_blacklist=cfg80211,bluetooth,nfc,wwan,mhi,cdc_wdm,usb_wwan
#   Keeps every radio's drivers out of the kernel, so the only network is a
#   cable the participants can see. Each entry is a core module the drivers
#   of one kind need: cfg80211 for Wi-Fi, bluetooth, nfc for built-in NFC
#   chips, and for cellular modems wwan and mhi (PCIe), cdc_wdm (USB data)
#   and usb_wwan (USB serial). USB contactless readers go through pcscd, and
#   USB tethering through the wired cdc_ether, rndis_host and cdc_ncm, which
#   none of these block.
#
# systemd.tpm2_wait=0
# systemd.mask=systemd-tpm2-setup-early.service
# systemd.mask=systemd-tpm2-setup.service
#   The system does not use the TPM, and leaves the machine's TPM as it found
#   it. Without these, systemd waits 90 seconds for a TPM the firmware reports
#   but the kernel fails to start (some AMD firmware TPMs), and
#   systemd-tpm2-setup stores a key in the TPM, in the initrd and after it. On
#   the kernel command line, the masks also apply in the initrd;
#   mkosi.postinst.chroot masks systemd-pcrlock, which writes a policy.
KernelCommandLine=
    systemd.volatile=overlay
    systemd.verity_root_options=panic-on-corruption
    console=tty0
    systemd.getty_auto=0
    quiet
    init_on_free=1
    slab_nomerge
    vsyscall=none
    debugfs=off
    randomize_kstack_offset=1
    intel_iommu=on
    iommu.passthrough=0
    iommu.strict=1
    module_blacklist=cfg80211,bluetooth,nfc,wwan,mhi,cdc_wdm,usb_wwan
    systemd.tpm2_wait=0
    systemd.mask=systemd-tpm2-setup-early.service
    systemd.mask=systemd-tpm2-setup.service

# The kernel package is per architecture, in mkosi.conf.d/. mkosi installs
# packages without their recommends.
Packages=
    # The system: systemd as init, with udev, D-Bus and logind. veritysetup
    # (cryptsetup-bin) tells boot-partition which disk holds the root.
    systemd
    systemd-sysv
    udev
    dbus
    libpam-systemd
    bash
    login
    passwd
    kmod
    cryptsetup-bin
    # The boot loader and the UKI stub, which mkosi takes from the image.
    systemd-boot-efi

    # rite-setup uses whiptail for menus, ckbcomp to convert XKB layouts,
    # and loadkeys to load the resulting console keymap.
    whiptail
    console-setup
    kbd

    # Pager, for man and the shell.
    less

    # Tab completion for rite in the session shell.
    bash-completion

    # Display stack: cage (wlroots kiosk compositor) runs foot fullscreen. dbus
    # and libpam-systemd, above, let logind open the session and set
    # XDG_RUNTIME_DIR; without them cage exits at once ("XDG_RUNTIME_DIR is not
    # set"). fonts-dejavu-core provides the TrueType font that foot's
    # "monospace" alias resolves to through fontconfig.
    cage
    foot
    foot-terminfo
    fonts-dejavu-core
    # Firmware the graphics drivers of AMD, NVIDIA and recent Intel GPUs load at
    # start; without it the driver takes over the display and leaves it black.
    firmware-amd-graphics
    firmware-nvidia-graphics
    firmware-intel-graphics

    # The PC/SC client, the one library the rite binary links besides glibc.
    # The binary is the one from the rite Docker image.
    libpcsclite1

    # Smart cards (PIV, YubiKey): pcscd talks to the reader through the CCID
    # driver, and asks polkit whether a client may use it (10-rite.rules).
    pcscd
    libccid
    polkitd

    # Network: DHCP on every wired link (80-rite-dhcp.network), names through
    # systemd-resolved. firmware-realtek is the firmware of the common Realtek
    # wired cards. No radios: see module_blacklist above.
    systemd-resolved
    firmware-realtek

    # Toolbox. Not needed by rite or the session; installed for convenience, so
    # the operator can inspect, convert or double-check data from the second
    # terminal (Ctrl+Alt+F2). Being in the system, they are covered by its root
    # hash like everything else.
    openssl
    iproute2
    jq
    xxd
    file
    nano
    qrencode
    zbar-tools
    gnupg
    opensc
    pcsc-tools
    yubikey-manager
    python3
    man-db
