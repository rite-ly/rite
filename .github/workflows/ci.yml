name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libpcsclite-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The default workspace build leaves the hardware-backend features off, so
      # lint the piv/yubikey code paths and their tests explicitly.
      - name: Clippy (hardware backends)
        run: cargo clippy -p rite-stdlib --features piv,yubikey --all-targets -- -D warnings
      - name: Clippy (pkcs11)
        run: cargo clippy -p rite-pkcs11 --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libpcsclite-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      # piv/yubikey are off by default; run their action and backend tests,
      # plus the example smoke tests so the PIV example ceremony is exercised.
      - name: Test (hardware backends)
        run: cargo test -p rite-stdlib -p rite --features piv,yubikey

  pkcs11:
    name: PKCS#11 (SoftHSM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SoftHSM
        run: sudo apt-get update && sudo apt-get install -y libssl-dev softhsm2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The token questions are #[ignore]d so a normal test run skips them.
      # They answer what a real PKCS#11 token does, which is what keeps the
      # wrapping model's claims about tokens from being specification reading.
      - name: Initialise a token
        run: |
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = INFO\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf" \
            softhsm2-util --init-token --slot 0 --label rite-test --so-pin 1234 --pin 1234
      - name: Ask the token
        env:
          SOFTHSM2_CONF: ${{ runner.temp }}/softhsm/softhsm2.conf
          SOFTHSM2_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test -p rite-pkcs11 -- --ignored --nocapture --test-threads=1

  msrv:
    # Verifies the MSRV floor declared on the library crates that are
    # published to crates.io. Binary-supporting crates (rite-stdlib,
    # rite-openssl, rite-runtime, rite-render, rite, rite-ls) ship as
    # part of the bundled product and float with the latest stable Rust.
    # Bump both this toolchain and the crates' `rust-version` together.
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check
        run: cargo check -p rite-sdk -p rite-model -p rite-resolver

  build:
    name: Build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: |
          cargo build -p rite --features openssl-vendored
          cargo build -p rite-ls
      # The default runner links OpenSSL 3.0, which has no ML-DSA or ML-KEM, so
      # the Test job compiles every `ossl350` test out of `rite-openssl` and
      # skips the post-quantum example. This job bundles a current OpenSSL, so
      # both run here, and anything behind that cfg is covered by this step
      # alone.
      - name: Test (vendored OpenSSL)
        run: |
          cargo test -p rite-openssl --features vendored
          cargo test -p rite --features openssl-vendored --test examples

  docker:
    name: Docker (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Exercise the Dockerfile build path so PRs catch regressions in the
      # toolchain image, bake spec, or runtime stage layout.
      - name: Bake binaries
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: ./docker-bake.hcl
          targets: binaries
          set: |
            *.cache-from=type=gha,scope=ci-smoke
            *.cache-to=type=gha,mode=max,scope=ci-smoke
      - name: Verify static musl binaries
        # amd64 produces "static-pie linked"; arm64 produces "statically linked"
        # (no PIE). Both are static (zero runtime deps); the PIE asymmetry comes
        # from Rust's target specs: x86_64-unknown-linux-musl sets
        # `static_position_independent_executables = true`, aarch64 does not.
        #
        # TODO: revisit when Rust adds static-PIE to aarch64-unknown-linux-musl
        # upstream (or set CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=
        # "-C link-arg=-static-pie" to force it here). Then tighten the grep
        # below back to 'static-pie linked' so a regression on either arch fails.
        run: |
          for f in dist/amd64/rite dist/amd64/rite-ls dist/arm64/rite dist/arm64/rite-ls; do
            file "$f" | tee /dev/stderr | grep -qE 'static(ally|-pie) linked'
          done
