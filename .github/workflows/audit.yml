name: Audit

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  # Dependabot alerts cover published advisories continuously, and
  # what is left here is yanks and RustSec informational advisories.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # `--deny warnings` fails the job on a yanked crate as well as on an advisory.
      # Suppressions live in `.cargo/audit.toml`.
      - name: Audit
        run: cargo audit --deny warnings
