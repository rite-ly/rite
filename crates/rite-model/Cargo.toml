[package]
name = "rite-model"
description = "Domain model and intermediate representation for the Rite key ceremony DSL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
repository.workspace = true
homepage.workspace = true
keywords = ["ceremony", "dsl", "rite"]
categories = ["security"]
publish = true

[dependencies]
rite-sdk = { workspace = true, features = ["schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
regex-lite = { workspace = true }
base16ct = { workspace = true }
base64ct = { workspace = true }
zeroize = { workspace = true }
sha2 = { workspace = true }
# The DSL vocabulary types describe themselves as JSON Schema, for the schema
# of a step's `with:` block.
schemars = { workspace = true }

[dev-dependencies]
# The published JSON Schemas are checked against the generated ones by this
# crate's tests.
jsonschema = { workspace = true }

[lints]
workspace = true
