[package]
name = "rite-cli"
description = "Author, execute, and verify cryptographic key ceremonies (the `rite` CLI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cli", "ceremony", "rite"]
categories = ["security", "command-line-utilities"]
# Gated on the crates.io `rite` name.
# At publish time, rename this package to `rite` and set `publish = true`; the binary is already named `rite`.
publish = false

[[bin]]
name = "rite"
path = "src/main.rs"

[features]
default = ["render", "openssl", "verification", "attestation", "crypto", "pki", "tui"]
render = ["dep:rite-render"]
openssl = ["rite-stdlib/openssl", "dep:openssl"]
verification = ["rite-stdlib/verification"]
attestation = ["rite-stdlib/attestation"]
crypto = ["rite-stdlib/crypto"]
pki = ["rite-stdlib/pki"]
openssl-vendored = ["rite-stdlib/openssl-vendored", "openssl"]
tui = ["dep:rite-tui"]

[dependencies]
rite-model = { workspace = true }
rite-resolver = { workspace = true }
rite-runtime = { workspace = true }
rite-render = { workspace = true, optional = true }
rite-stdlib = { workspace = true }
rite-tui = { workspace = true, optional = true }
openssl = { workspace = true, optional = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
secrecy = { workspace = true }
rpassword = { workspace = true }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
