[workspace]
resolver = "2"
members = [
    "crates/rite-sdk",
    "crates/rite-model",
    "crates/rite-resolver",
    "crates/rite-runtime",
    "crates/rite-stdlib",
    "crates/rite-openssl",
    "crates/rite-piv",
    "crates/rite-yubikey",
    "crates/rite-render",
    "crates/rite",
    "crates/rite-ls",
    "crates/rite-tui",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/rite-ly/rite"
homepage = "https://ritely.io"

[workspace.dependencies]
# Workspace-internal crates. The `version` only matters at publish time, where it
# pins the inter-crate dependency for users installing from crates.io. Every crate
# is published together at the same version each release: the runtime, stdlib,
# OpenSSL backend, renderer, and TUI carry no cross-version API guarantee.
rite-sdk = { path = "crates/rite-sdk", version = "0.4" }
rite-model = { path = "crates/rite-model", version = "0.4" }
rite-resolver = { path = "crates/rite-resolver", version = "0.4" }
rite-runtime = { path = "crates/rite-runtime", version = "0.4" }
rite-openssl = { path = "crates/rite-openssl", version = "0.4" }
rite-piv = { path = "crates/rite-piv", version = "0.4" }
rite-yubikey = { path = "crates/rite-yubikey", version = "0.4" }
# Sole consumer (the `rite` CLI) builds it without default features.
rite-stdlib = { path = "crates/rite-stdlib", version = "0.4", default-features = false }
rite-render = { path = "crates/rite-render", version = "0.4" }
rite-tui = { path = "crates/rite-tui", version = "0.4" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
thiserror = "2.0.18"
bitflags = { version = "2.11.1", features = ["serde"] }
marked-yaml = { version = "0.8.0", features = ["serde"] }
indexmap = { version = "2.14.0", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std", "serde"] }
insta = { version = "1.47.2", features = ["yaml", "filters"] }
assert_cmd = "2.2.2"
secrecy = "0.10.3"
rpassword = "7.5.2"
base16ct = { version = "1.0.0", features = ["alloc"] }
base32ct = { version = "0.3.1", features = ["alloc"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
rand = "0.10.1"
openssl = { version = "0.10.78" }
yubikey = "0.8"
tempfile = "3.27.0"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.2"
minijinja = { version = "2.13.0", default-features = false, features = [
    "builtins",
    "serde",
] }
tokio = "1.52.1"
tower-lsp-server = "0.23.0"
crossbeam-channel = "0.5.15"
ratatui = { version = "0.30.0", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }
crossterm = "0.29.0"
dashmap = "6.1.0"
subtle = "2.6.1"
sysinfo = { version = "0.39.0", default-features = false, features = ["system", "disk"] }
x509-cert = "0.3.0"
der = "0.7.10"
sha2 = "0.11.0"
sha1 = "0.11.0"
hkdf = "0.13.0"
rsa = "0.9.10"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Overly noisy on a types-heavy crate — allow selectively
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Proactive correctness
# Note: allow-unwrap-in-tests / allow-expect-in-tests are set in clippy.toml
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
# Banned in committed code
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
self_named_module_files = "deny"
