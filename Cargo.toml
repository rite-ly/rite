[workspace]
resolver = "2"
members = [
    "crates/rite-sdk",
    "crates/rite-model",
    "crates/rite-resolver",
    "crates/rite-runtime",
    "crates/rite-stdlib",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rite-ly/rite"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
marked-yaml = { version = "0.8", features = ["serde"] }
insta = { version = "1", features = ["yaml"] }
bitflags = { version = "2", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
secrecy = "0.10"
base16ct = { version = "0.3", features = ["alloc"] }
base32ct = { version = "0.2", features = ["alloc"] }
base64ct = { version = "1.6", features = ["alloc"] }
rand      = "0.9"
tempfile  = "3"
subtle    = "2"
sysinfo   = { version = "0.33", default-features = false, features = ["system"] }
x509-cert = "0.2"
der       = "0.7"
sha1      = "0.10"
rsa       = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Overly noisy on a types-heavy crate — allow selectively
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Proactive correctness
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
# Banned in committed code
dbg_macro = "deny"
print_stdout = "warn"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
self_named_module_files = "deny"
