# The "Rite Ceremony (safe mode)" boot entry, a second profile of the UKI, for
# machines where the main entry does not boot or does not display. systemd-boot
# shows the TITLE after the system's name. It runs the session on the text
# console (rite.console), with the boot progress shown.
#
# mkosi appends Cmdline to the main command line (mkosi.conf), and the kernel
# takes the last value of an option, so this profile turns off the DMA
# protections that depend on the hardware: Intel VT-d off, lazy IOMMU
# invalidation (the Debian kernel's default). nomodeset keeps the display the
# firmware set up instead of loading a graphics driver, so the console shows
# whatever the GPU. loglevel=3 and systemd.show_status=yes override quiet.
[UKIProfile]
Profile=
    ID=safe
    TITLE=safe mode
Cmdline=
    rite.console
    loglevel=3
    systemd.show_status=yes
    intel_iommu=off
    iommu.strict=0
    nomodeset
